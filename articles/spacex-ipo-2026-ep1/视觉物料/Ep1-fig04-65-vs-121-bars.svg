<svg width="100%" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SpaceX 政府预收款 vs 股权融资双柱对比</title>
<desc>$121 亿政府预收款 vs $65 亿股权融资清算优先权——美国政府是 SpaceX 最大的 VC</desc>

<rect x="0" y="0" width="680" height="600" fill="#FAF8F5"/>

<text x="40" y="44" font-family="'Inter','Helvetica Neue',sans-serif" font-size="10" font-weight="500" fill="#E30613" letter-spacing="3.5px">SPACEX IPO 2026 · EP 1 · FIG 04</text>
<line x1="40" y1="58" x2="640" y2="58" stroke="#d8d4cc" stroke-width="0.5"/>
<text x="40" y="92" font-family="'Inter','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a8784" letter-spacing="1px">UNCLE SAM IS THE BIGGEST VC</text>
<text x="40" y="120" font-family="'Noto Serif SC','Songti SC',serif" font-size="20" font-weight="500" fill="#111111">美国政府是 SpaceX 最大的 VC</text>
<text x="40" y="146" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="400" fill="#555555">2025 末政府预收款 $121 亿 vs SpaceX 主体累计股权融资清算优先权 $65 亿</text>

<line x1="40" y1="450" x2="640" y2="450" stroke="#888" stroke-width="0.5"/>

<rect x="120" y="296" width="120" height="154" fill="#9ab4d8" stroke="#3a6aaa" stroke-width="0.5"/>
<text x="180" y="282" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="36" font-weight="700" fill="#111111" text-anchor="middle">$65 亿</text>
<text x="180" y="476" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" font-weight="500" fill="#111111" text-anchor="middle">14 轮股权融资</text>
<text x="180" y="495" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">清算优先权累计</text>
<text x="180" y="513" font-family="'Inter','Helvetica Neue',sans-serif" font-size="10" fill="#8a8784" text-anchor="middle" letter-spacing="1px">S-1 L25238</text>

<rect x="440" y="164" width="120" height="286" fill="#E30613"/>
<text x="500" y="150" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="36" font-weight="700" fill="#E30613" text-anchor="middle">$121 亿</text>
<text x="500" y="476" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" font-weight="500" fill="#111111" text-anchor="middle">政府预收款</text>
<text x="500" y="495" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">2025 末 deferred revenue</text>
<text x="500" y="513" font-family="'Inter','Helvetica Neue',sans-serif" font-size="10" fill="#8a8784" text-anchor="middle" letter-spacing="1px">S-1 L23983</text>

<line x1="250" y1="300" x2="430" y2="300" stroke="#E30613" stroke-width="0.5" stroke-dasharray="3,3"/>
<rect x="312" y="288" width="56" height="24" fill="#fdecec" stroke="#E30613" stroke-width="0.5"/>
<text x="340" y="305" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="14" font-weight="700" fill="#E30613" text-anchor="middle">1.86×</text>

<line x1="40" y1="550" x2="640" y2="550" stroke="#d8d4cc" stroke-width="0.5"/>
<text x="40" y="578" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="500" fill="#111111">政府不是「先发射后付款的客户」——而是「按里程碑预付的资助方」</text>
<text x="640" y="578" font-family="'Inter','Helvetica Neue',sans-serif" font-size="9" fill="#888" text-anchor="end" letter-spacing="1.5px">S-1 L17988</text>
</svg>
