<text x="292" y="293" font-family="'Inter','Helvetica Neue',sans-serif" font-size="10" fill="#aa4444">2009 退役</text>
<text x="246" y="320" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="9" fill="#111111" text-anchor="middle">2008 首成 · 5 次发射</text>

<text x="478" y="316" font-family="'Inter','Helvetica Neue',sans-serif" font-size="9" fill="#aa4444" letter-spacing="1.5px">烧</text>
<text x="492" y="316" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="11" font-weight="500" fill="#aa4444">$~1 亿</text>
<text x="540" y="316" font-family="'Inter','Helvetica Neue',sans-serif" font-size="9" fill="#7a7a80" letter-spacing="1.5px">收</text>
<text x="554" y="316" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="11" font-weight="500" fill="#aa4444">$0（失败品）</text>

<line x1="40" y1="340" x2="640" y2="340" stroke="#ece8e0" stroke-width="0.5"/>

<text x="40" y="378" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="500" fill="#111111">Falcon 9</text>
<text x="40" y="396" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="9" fill="#8a8784">2005—2026+</text>

<rect x="216" y="385" width="60" height="22" fill="#d8b8b8"/>
<rect x="276" y="385" width="60" height="22" fill="#9ab4d8"/>
