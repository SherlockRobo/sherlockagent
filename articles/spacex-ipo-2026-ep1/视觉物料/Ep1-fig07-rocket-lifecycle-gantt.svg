<text x="40" y="298" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="500" fill="#111111">Falcon 1</text>
<text x="40" y="316" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="9" fill="#8a8784">2002—2009</text>

<rect x="156" y="305" width="60" height="22" fill="#d8b8b8"/>
<rect x="216" y="305" width="60" height="22" fill="#9ab4d8"/>
