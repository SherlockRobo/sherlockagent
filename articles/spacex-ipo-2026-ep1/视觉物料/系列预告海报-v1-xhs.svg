<svg width="100%" viewBox="0 0 680 850" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SpaceX IPO 系列预告海报 v1（xhs 4:5 竖版）</title>
<desc>SpaceX IPO 4 篇系列宣传海报，仿 SEC S-1 官方招股书黑底科技风。用于小红书首图。</desc>

<rect x="0" y="0" width="680" height="850" fill="#000000"/>

<line x1="40" y1="55" x2="640" y2="55" stroke="#1F1F1F" stroke-width="0.5"/>
<line x1="40" y1="795" x2="640" y2="795" stroke="#1F1F1F" stroke-width="0.5"/>

<text x="40" y="40" fill="#888888" font-family="ui-monospace, monospace" font-size="10" letter-spacing="3">SPCX · IPO 2026 · INDEPENDENT RESEARCH</text>
<text x="640" y="40" fill="#888888" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" text-anchor="end">谷德禄氪</text>

<g transform="translate(40,90)">
<rect x="0" y="0" width="600" height="40" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
<text x="300" y="26" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="13" letter-spacing="6" text-anchor="middle">PRELIMINARY PROSPECTUS · A SERIES</text>
</g>

<text x="340" y="200" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="56" font-weight="500" letter-spacing="-2" text-anchor="middle">SpaceX</text>
<text x="340" y="255" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="56" font-weight="500" letter-spacing="-2" text-anchor="middle">招股书</text>
<text x="340" y="310" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="56" font-weight="500" letter-spacing="-2" text-anchor="middle">深度系列</text>

<line x1="290" y1="335" x2="390" y2="335" stroke="#FFFFFF" stroke-width="1"/>
<text x="340" y="365" fill="#888888" font-family="ui-sans-serif, system-ui" font-size="14" letter-spacing="2" text-anchor="middle">用 600 页 S-1 看 Musk 下一步</text>

<text x="340" y="415" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="11" letter-spacing="4" text-anchor="middle">4 篇 · 1 个互动工具 · 2026 年 5-6 月</text>

<g transform="translate(40,455)">
<rect x="0" y="0" width="600" height="100" fill="none" stroke="#1F1F1F" stroke-width="0.5"/>
<rect x="0" y="0" width="6" height="100" fill="#FFFFFF"/>
<text x="22" y="28" fill="#888888" font-family="ui-monospace, monospace" font-size="10" letter-spacing="3">EP1 · 5/25</text>
<text x="22" y="58" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="500">Musk 钱怎么花的</text>
<text x="22" y="82" fill="#888888" font-family="ui-sans-serif, system-ui" font-size="12">100 亿融资把火箭做完了，下一步全部砸向 AI</text>
</g>

<g transform="translate(40,565)">
<rect x="0" y="0" width="600" height="100" fill="none" stroke="#1F1F1F" stroke-width="0.5"/>
<rect x="0" y="0" width="6" height="100" fill="#888888"/>
<text x="22" y="28" fill="#888888" font-family="ui-monospace, monospace" font-size="10" letter-spacing="3">EP3 · 6/02</text>
<text x="22" y="58" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="500">火箭经济计算器</text>
<text x="22" y="82" fill="#888888" font-family="ui-sans-serif, system-ui" font-size="12">F9 到 Starship 单 kg 入轨成本，互动可调</text>
</g>

<g transform="translate(40,675)">
<rect x="0" y="0" width="600" height="100" fill="none" stroke="#1F1F1F" stroke-width="0.5"/>
<rect x="0" y="0" width="6" height="100" fill="#888888"/>
<text x="22" y="28" fill="#888888" font-family="ui-monospace, monospace" font-size="10" letter-spacing="3">番外 · 6/12</text>
<text x="22" y="58" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="500">该不该买 IPO</text>
<text x="22" y="82" fill="#888888" font-family="ui-sans-serif, system-ui" font-size="12">美股 IPO 长期跑输 3.4%/年</text>
</g>

<text x="40" y="815" fill="#666666" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">DATA · SEC SPACEX S-1 (2026-05-20)</text>
<text x="640" y="815" fill="#FFFFFF" font-family="ui-sans-serif, system-ui" font-size="11" letter-spacing="2" text-anchor="end" font-weight="500">关注「谷德禄氪」</text>

</svg>
