<text x="40" y="884" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="500" fill="#111111">三条线不同步——融资慢，烧钱主战场迁移，FCF 2024 已转负。</text>
<text x="40" y="908" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="500" fill="#E30613">2025 是撕裂点：补贴链断了，必须找外部钱。</text>
