<text x="226" y="592" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="13" font-weight="400" fill="#888">→</text>
<text x="252" y="592" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="13" font-weight="500" fill="#111111">61%</text>
