<rect x="0" y="0" width="680" height="480" fill="#FAF8F5"/>

<text x="40" y="34" font-family="'Inter','Helvetica Neue',sans-serif" font-size="10" font-weight="500" fill="#E30613" letter-spacing="3.5px">SPACEX IPO 2026 · EP 1 · THREE PARALLEL LINES</text>
<line x1="40" y1="48" x2="640" y2="48" stroke="#d8d4cc" stroke-width="0.5"/>

<image x="-40" y="60" width="300" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipL)" xlink:href="s1-images/a18_starshiplandingimage.jpg"/>
<rect x="0" y="60" width="220" height="300" fill="none" stroke="#d8d4cc" stroke-width="0.5"/>
