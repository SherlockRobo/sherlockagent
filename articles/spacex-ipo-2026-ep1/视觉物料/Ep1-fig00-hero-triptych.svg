<line x1="40" y1="392" x2="640" y2="392" stroke="#d8d4cc" stroke-width="0.5"/>
<text x="40" y="420" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" font-weight="500" fill="#111111">三条业务并行跑了 24 年——</text>
<text x="40" y="446" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="400" fill="#555555">从「造火箭公司」到「AI 接管」，这一篇拆三条平行时间线</text>

<text x="640" y="470" font-family="'Inter','Helvetica Neue',sans-serif" font-size="9" fill="#888" letter-spacing="1.5px" text-anchor="end">IMAGES · SPACEX S-1 (2026-05-20)</text>
