<text x="14" y="338" font-family="'Inter','Helvetica Neue',sans-serif" font-size="9" font-weight="500" fill="#E30613" letter-spacing="2px">01 · SPACE</text>
<text x="14" y="354" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="500" fill="#FFFFFF">火箭 / Starship</text>

<image x="230" y="60" width="220" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipM)" xlink:href="s1-images/a22_starlinkv3overview.jpg"/>
<rect x="230" y="60" width="220" height="300" fill="none" stroke="#d8d4cc" stroke-width="0.5"/>
<rect x="230" y="320" width="220" height="40" fill="rgba(11,11,11,0.85)"/>
<text x="244" y="338" font-family="'Inter','Helvetica Neue',sans-serif" font-size="9" font-weight="500" fill="#E30613" letter-spacing="2px">02 · CONNECTIVITY</text>
<text x="244" y="354" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" font-weight="500" fill="#FFFFFF">Starlink / 卫星网络</text>

<image x="460" y="60" width="220" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipR)" xlink:href="s1-images/xai_sitexscoutxx19a.jpg"/>
<rect x="460" y="60" width="220" height="300" fill="none" stroke="#d8d4cc" stroke-width="0.5"/>
