<text x="18" y="78" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">SpaceX 三本账</text>
<text x="18" y="103" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">谁在赚谁在烧</text>
<text x="18" y="145" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="12">Starlink EBITDA 72 亿</text>
<text x="18" y="163" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="12">补贴整个集团</text>
</g>

<g transform="translate(0,200)">
<rect x="0" y="0" width="290" height="180" rx="14" fill="#FFFCF5" stroke="#1B4332" stroke-width="1.5"/>
<rect x="178" y="14" width="100" height="22" rx="11" fill="#6B4E9C"/>
<text x="228" y="29" fill="#FFFCF5" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="700" text-anchor="middle">互动工具</text>
