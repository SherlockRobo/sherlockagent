<text x="18" y="145" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="12">F9 到 Starship</text>
<text x="18" y="163" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="12">复用次数滑块自己调</text>
</g>

<g transform="translate(310,200)">
<rect x="0" y="0" width="290" height="180" rx="14" fill="#FFFCF5" stroke="#1B4332" stroke-width="1.5"/>
<rect x="178" y="14" width="100" height="22" rx="11" fill="#E07A2C"/>
<text x="228" y="29" fill="#FFFCF5" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="700" text-anchor="middle">独家推演</text>
<text x="18" y="28" fill="#1B4332" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">EP4 · 6/06</text>
<text x="18" y="78" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">Musk 帝国拆解</text>
<text x="18" y="103" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">反向合并 Tesla</text>
<text x="18" y="145" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="12">SpaceX 估值反超 Tesla</text>
<text x="18" y="163" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="12">下一步合股？</text>
</g>

<g transform="translate(0,400)">
<rect x="0" y="0" width="290" height="180" rx="14" fill="#FFFCF5" stroke="#1B4332" stroke-width="1.5"/>
<rect x="178" y="14" width="100" height="22" rx="11" fill="#1B4332"/>
