<svg width="100%" viewBox="0 0 1280 720" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SpaceX 系列预告海报 v4 公众号封面（16:9 横版）</title>
<desc>v4 横版定稿。米黄底墨绿主色，左栏主标 + 右栏 6 卡 2 列 3 行布局。用于公众号文章封面。</desc>

<rect x="0" y="0" width="1280" height="720" fill="#F5EFE0"/>

<g transform="translate(60,60)">
<rect x="0" y="0" width="500" height="600" rx="22" fill="#FFFCF5" stroke="#1B4332" stroke-width="2"/>

<rect x="36" y="36" width="16" height="16" rx="3" fill="#E07A2C"/>
<text x="60" y="50" fill="#1B4332" font-family="ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="3">SPACEX IPO LAB</text>
<text x="464" y="50" fill="#888888" font-family="ui-monospace, monospace" font-size="11" text-anchor="end" letter-spacing="1">谷德禄氪 · 独立研究笔记</text>

<text x="36" y="160" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="64" font-weight="700">SpaceX</text>
<text x="36" y="226" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="64" font-weight="700">招股书</text>
<text x="36" y="292" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="64" font-weight="700">深度系列</text>

<line x1="36" y1="320" x2="200" y2="320" stroke="#E07A2C" stroke-width="3"/>
<text x="36" y="360" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="16">用 600 页 S-1 看 Musk 下一步</text>

<rect x="36" y="395" width="130" height="34" rx="17" fill="#E07A2C"/>
<text x="101" y="416" fill="#FFFCF5" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="500" text-anchor="middle">6 期连载</text>

<rect x="176" y="395" width="150" height="34" rx="17" fill="none" stroke="#6B4E9C" stroke-width="1.5"/>
<text x="251" y="416" fill="#6B4E9C" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="500" text-anchor="middle">含 2 个互动工具</text>

<rect x="336" y="395" width="130" height="34" rx="17" fill="none" stroke="#1B4332" stroke-width="1"/>
<text x="401" y="416" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="500" text-anchor="middle">招股书拆透</text>

<text x="36" y="475" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="17" font-weight="700">这个系列写什么</text>
<text x="36" y="500" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="13">现金流 · 盈利模式 · Musk 帝国</text>
<text x="36" y="520" fill="#555555" font-family="ui-sans-serif, system-ui" font-size="13">IPO 决策 · 招股书可视化</text>

<text x="36" y="565" fill="#888888" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">DATA · SEC SPACEX S-1 (2026-05-20)</text>
</g>

<g transform="translate(620,60)">

<g transform="translate(0,0)">
