<text x="18" y="78" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">想买 SpaceX</text>
<text x="18" y="103" fill="#1B4332" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">又怕 IPO 坑？</text>
