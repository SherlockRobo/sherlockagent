<text x="18" y="28" fill="#FFFCF5" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">EP1 · 5/25</text>
<text x="18" y="78" fill="#FFFCF5" font-family="ui-sans-serif, system-ui" font-size="18" font-weight="700">融资 100 亿做完火箭</text>
