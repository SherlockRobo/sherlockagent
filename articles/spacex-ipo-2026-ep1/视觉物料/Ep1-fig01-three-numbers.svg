<text x="62" y="200" font-family="'Inter','Helvetica Neue',sans-serif" font-size="11" font-weight="500" fill="#E30613" letter-spacing="2px">FACT 01</text>
<text x="640" y="200" font-family="'Inter','Helvetica Neue',sans-serif" font-size="11" font-weight="500" fill="#8a8784" letter-spacing="1.5px" text-anchor="end">S-1 / L25238</text>
<text x="62" y="298" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="104" font-weight="700" fill="#111111" letter-spacing="-3px">$6.5B</text>
<text x="62" y="334" font-family="'Noto Serif SC','Songti SC',serif" font-size="22" font-weight="500" fill="#111111">SpaceX 主体 20 年股权融资清算优先权</text>
<text x="62" y="360" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" font-weight="400" fill="#555555">OpenAI 一轮就超过这个数</text>
<line x1="40" y1="400" x2="640" y2="400" stroke="#d8d4cc" stroke-width="0.5"/>

<rect x="40" y="430" width="3" height="190" fill="#E30613"/>
<text x="62" y="460" font-family="'Inter','Helvetica Neue',sans-serif" font-size="11" font-weight="500" fill="#E30613" letter-spacing="2px">FACT 02</text>
<text x="640" y="460" font-family="'Inter','Helvetica Neue',sans-serif" font-size="11" font-weight="500" fill="#8a8784" letter-spacing="1.5px" text-anchor="end">S-1 / L19857</text>
<text x="62" y="558" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="104" font-weight="700" fill="#111111" letter-spacing="-3px">85.1%</text>
<text x="62" y="594" font-family="'Noto Serif SC','Songti SC',serif" font-size="22" font-weight="500" fill="#111111">Musk IPO 前投票权</text>
<text x="62" y="620" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" font-weight="400" fill="#555555">持股稀释到 12.3%，投票权反弹回 85.1%</text>
<line x1="40" y1="660" x2="640" y2="660" stroke="#d8d4cc" stroke-width="0.5"/>

<rect x="40" y="690" width="3" height="190" fill="#E30613"/>
<text x="62" y="720" font-family="'Inter','Helvetica Neue',sans-serif" font-size="11" font-weight="500" fill="#E30613" letter-spacing="2px">FACT 03</text>
<text x="640" y="720" font-family="'Inter','Helvetica Neue',sans-serif" font-size="11" font-weight="500" fill="#8a8784" letter-spacing="1.5px" text-anchor="end">S-1 / L2884</text>
<text x="62" y="818" font-family="'JetBrains Mono','IBM Plex Mono',monospace" font-size="104" font-weight="700" fill="#111111" letter-spacing="-3px">76%</text>
