<svg width="100%" viewBox="0 0 680 1100" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SpaceX 三个反认知数字 白底版</title>
<desc>三个标志性数字白底版——$6.5B / 85.1% / 76%</desc>

<rect x="0" y="0" width="680" height="1100" fill="#FAF8F5"/>

<text x="40" y="44" font-family="'Inter','Helvetica Neue',sans-serif" font-size="10" font-weight="500" fill="#E30613" letter-spacing="3.5px">SPACEX IPO 2026 · EP 1 · PROSPECTUS BREAKDOWN</text>
<line x1="40" y1="58" x2="640" y2="58" stroke="#d8d4cc" stroke-width="0.5"/>
<text x="40" y="92" font-family="'Inter','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a8784" letter-spacing="1px">THREE NUMBERS THAT DON'T ADD UP</text>
<text x="40" y="120" font-family="'Noto Serif SC','Songti SC',serif" font-size="20" font-weight="500" fill="#111111">三个让人愣住的数字——</text>

