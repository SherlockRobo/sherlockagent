<text x="40" y="1006" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" font-weight="400" fill="#555555">最便宜火箭工厂、最赚钱卫星互联网、最忠诚政府客户</text>
<text x="40" y="1034" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" font-weight="500" fill="#E30613">为什么 2026 Q1 自由现金流 −$91 亿，现金撑不到 2 个季度？</text>

<line x1="40" y1="1064" x2="640" y2="1064" stroke="#d8d4cc" stroke-width="0.5"/>
<text x="40" y="1086" font-family="'Inter','Helvetica Neue',sans-serif" font-size="10" font-weight="400" fill="#888888" letter-spacing="1.5px">SOURCE: SPACEX S-1 (2026-05-20) · 谷德禄氪</text>
