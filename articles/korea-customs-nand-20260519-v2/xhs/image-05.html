<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
    body{margin:0;background:#F5F1EA;font-family:"Noto Serif SC","Songti SC","STSong",serif;color:#111111}
    .card{width:1080px;height:1440px;background:#FFFEFB;box-sizing:border-box;padding:68px 72px;border:1px solid #DDD5C9;position:relative;overflow:hidden}
    .eyebrow{font:900 22px/1.2 Menlo,Consolas,monospace;color:#E30613;letter-spacing:.16em;text-transform:uppercase;margin-bottom:34px}
    h1{font-size:74px;line-height:1.08;margin:0 0 28px;letter-spacing:0}
    .sub{font-size:34px;line-height:1.45;color:#6E6961;font-weight:800;margin-bottom:38px}
    .chiprow{display:flex;gap:16px;flex-wrap:wrap;margin:26px 0 36px}
    .chip{border:2px solid #234B39;color:#234B39;border-radius:999px;padding:12px 20px;font-size:24px;font-weight:900;line-height:1}
    .chip.hot{background:#E30613;border-color:#E30613;color:white}
    .big{font-size:112px;line-height:1;font-weight:900;margin:26px 0;color:#E30613}
    .metric{border:2px solid #DDD5C9;padding:26px 28px;background:#fff;margin:16px 0}
    .metric .k{font:900 20px/1.2 Menlo,Consolas,monospace;color:#E30613;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
    .metric .v{font-size:54px;line-height:1;font-weight:900}
    .metric .s{font-size:25px;line-height:1.38;color:#6E6961;font-weight:800;margin-top:18px}
    .black{background:#111111;color:white;padding:26px 30px;font-size:34px;line-height:1.42;font-weight:900;margin-top:30px}
    .foot{position:absolute;left:72px;right:72px;bottom:54px;border-top:2px solid #DDD5C9;padding-top:20px;font:900 20px/1.2 Menlo,Consolas,monospace;color:#8A857B;letter-spacing:.1em}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .mini{border:2px solid #DDD5C9;padding:24px;background:#fff;min-height:170px}
    .mini b{display:block;font-size:44px;color:#E30613;line-height:1;margin-bottom:18px}
    .mini span{font-size:24px;line-height:1.35;font-weight:900}
    .list{display:grid;gap:18px;margin-top:32px}
    .li{display:grid;grid-template-columns:58px 1fr;gap:18px;border:2px solid #DDD5C9;background:#fff;padding:22px 24px}
    .li b{font:900 28px/1 Georgia,serif;color:#E30613}
    .li h2{font-size:31px;line-height:1.25;margin:0 0 8px}
    .li p{font-size:24px;line-height:1.4;color:#6E6961;font-weight:800;margin:0}
    img.figure{width:100%;display:block;border:2px solid #DDD5C9;margin:22px 0}
    
  </style></head><body><main class="card">
      <div class="eyebrow">04 · YMTC LOGIC</div>
      <h1>这和长江有什么关系？</h1>
      <div class="sub">长江不会直接出现在韩国海关里，但会改变中国从韩国买什么。</div>
      <div class="list">
        <div class="li"><b>低</b><div><h2>消费 SSD / 国产 OEM</h2><p>最可能先被国产替代。</p></div></div>
        <div class="li"><b>中</b><div><h2>手机 / PC / 客户端 SSD</h2><p>看认证、稳定供货和客户导入。</p></div></div>
        <div class="li"><b>高</b><div><h2>企业级 / 车规 / 海外高端</h2><p>短期仍要长期验证。</p></div></div>
      </div>
      <div class="black">能跟踪的不是一句“受益”，而是价格、份额和结构变化。</div>
      <div class="foot">YMTC · SUBSTITUTION MAP</div>
    </main></body></html>
