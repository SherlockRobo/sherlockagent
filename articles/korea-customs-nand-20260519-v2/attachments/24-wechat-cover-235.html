<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body{margin:0;background:#F5F1EA;font-family:"Noto Serif SC","Songti SC","STSong",serif;color:#111}
    .cover{width:2350px;height:1000px;background:#FFFEFB;box-sizing:border-box;padding:78px 96px;border:1px solid #DDD5C9;display:grid;grid-template-columns:1fr 930px;gap:82px;overflow:hidden}
    .eyebrow{font:900 30px/1.2 Menlo,Consolas,monospace;color:#E30613;letter-spacing:.15em;text-transform:uppercase;margin-bottom:38px}
    h1{font-size:92px;line-height:1.08;margin:0 0 32px;letter-spacing:0;max-width:1120px}
    .lead{font-size:42px;line-height:1.35;color:#5F5A52;font-weight:800;max-width:1020px;margin-bottom:42px}
    .chips{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:42px}
    .chip{border:3px solid #234B39;color:#234B39;border-radius:999px;padding:14px 28px;font-size:30px;font-weight:900;line-height:1}
    .chip.hot{background:#E30613;border-color:#E30613;color:#fff}
    .points{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1060px}
    .point{border:2px solid #DDD5C9;background:#fff;padding:24px 28px;min-height:112px}
    .point b{font:900 27px/1 Menlo,Consolas,monospace;color:#E30613;margin-right:12px}
    .point span{font-size:34px;line-height:1.28;font-weight:900}
    .point p{font-size:24px;line-height:1.35;color:#666058;font-weight:700;margin:12px 0 0}
    .visual{align-self:center;position:relative}
    .visual img{display:block;width:100%;border:2px solid #DDD5C9}
    .caption{position:absolute;left:34px;right:34px;bottom:34px;background:#111;color:#fff;padding:22px 28px;font-size:34px;line-height:1.28;font-weight:900}
  </style>
</head>
<body>
  <main class="cover">
    <section>
      <div class="eyebrow">MONEYRECIPE · NAND TEMPERATURE</div>
      <h1>DRAM/HBM 之后，NAND 跟上了吗？</h1>
      <div class="lead">长江上市前，用韩国海关搭一支 NAND 外部温度计。</div>
      <div class="chips">
        <div class="chip hot">NAND ASP +252.4%</div>
        <div class="chip">YMTC 11%</div>
        <div class="chip">中国持续在买高端 NAND</div>
      </div>
      <section class="points">
        <div class="point"><span><b>01</b>NAND 跟涨不领涨</span><p>发动机仍是 DRAM/HBM。</p></div>
        <div class="point"><span><b>02</b>中国方向既多又贵</span><p>占比、净重、ASP 都上升。</p></div>
        <div class="point"><span><b>03</b>长江先看外部代理</span><p>不写兑现，只看温度计。</p></div>
        <div class="point"><span><b>04</b>Q2 先看海关</span><p>比财报早 2-3 个月。</p></div>
      </section>
    </section>
    <section class="visual">
      <img src="21-memory-heat-index-gauges.png" alt="存储价格热力仪表盘">
      <div class="caption">NAND 已热，但还没到 HBM/DRAM 的温度。</div>
    </section>
  </main>
</body>
</html>
