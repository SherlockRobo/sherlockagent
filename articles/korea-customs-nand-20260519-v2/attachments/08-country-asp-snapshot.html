<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同一个韩国 Memory，卖到不同目的地的单价不一样</title>
<style>
body{margin:0;background:#faf7f2;color:#1c1b19;font-family:"Noto Serif SC","Songti SC","STSong",serif}
.card{width:1080px;box-sizing:border-box;padding:54px 62px;background:#fffefb;border:1px solid #ddd7ca}
.kicker{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;letter-spacing:3px;color:#d6261e;text-transform:uppercase;margin-bottom:12px}
h1{font-size:44px;line-height:1.2;margin:0 0 32px;color:#1c1b19}
.note{font-size:20px;line-height:1.65;color:#56544f;margin-top:26px}
.grid{display:grid;gap:18px}
.bar{display:grid;grid-template-columns:120px 1fr 190px;align-items:center;gap:18px;font-size:23px}
.track{height:34px;background:#efeae0;border:1px solid #ddd7ca;position:relative}
.fill{height:100%;background:#d6261e}
.val{font-family:Georgia,serif;font-weight:800;color:#d6261e;text-align:right}
.pill{display:inline-block;border:1px solid #ddd7ca;border-radius:2px;padding:8px 14px;background:#f2eee7;font-size:18px;color:#56544f}
.big{font-family:Georgia,serif;font-weight:900;color:#d6261e;font-size:58px;line-height:1}
.axis{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:#56544f}
.small{font-size:18px;color:#56544f;line-height:1.6}
</style>
</head>
<body><div class="card"><div class="kicker">COUNTRY ASP SPREAD · 2026.04</div><h1>同一个韩国 Memory，卖到不同目的地的单价不一样</h1><div class="grid">
      <div class="bar">
        <div>中国</div>
        <div class="track"><div class="fill" style="width:72.0%"></div></div>
        <div class="val">84,332</div>
      </div>
      <div class="bar">
        <div>美国</div>
        <div class="track"><div class="fill" style="width:68.0%"></div></div>
        <div class="val">79,659</div>
      </div>
      <div class="bar">
        <div>日本</div>
        <div class="track"><div class="fill" style="width:63.9%"></div></div>
        <div class="val">74,846</div>
      </div>
      <div class="bar">
        <div>越南</div>
        <div class="track"><div class="fill" style="width:39.5%"></div></div>
        <div class="val">46,286</div>
      </div>
      <div class="bar">
        <div>中国台湾</div>
        <div class="track"><div class="fill" style="width:100.0%"></div></div>
        <div class="val">117,188</div>
      </div></div>
    <div class="note">单位：美元/kg。国家价差不能直接等同于终端售价，但能提示不同目的地背后的需求结构、产品结构和定价压力。</div></div></body>
</html>
