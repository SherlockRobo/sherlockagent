<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>供给侧辅助验证</title><style>
  :root{--paper:#fffefb;--bg:#faf8f5;--ink:#111;--muted:#7a7770;--line:#d8d4cc;--soft:#f3efe6;--accent:#e30613;--redsoft:#fdecec}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif}
  .canvas{width:1080px;min-height:1350px;background:var(--paper);padding:58px 62px;border-top:10px solid var(--ink)}
  .eyebrow{font-family:Georgia,serif;font-style:italic;font-size:18px;letter-spacing:3px;color:var(--accent);text-transform:uppercase}
  h1{margin:12px 0 10px;font-size:54px;line-height:1.16;letter-spacing:0}
  .sub{font-size:24px;color:var(--muted);line-height:1.55;margin-bottom:38px}
  .panel{border:2px solid var(--ink);padding:28px;background:#fff;margin:28px 0}
  .row{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start;border-bottom:1px solid var(--line);padding:18px 0}
  .row:last-child{border-bottom:0}
  .label{font-size:22px;font-weight:700}
  .value{font-size:23px;line-height:1.65}
  .pill{display:inline-block;border-radius:0;background:var(--ink);color:#fff;padding:4px 10px;font-size:18px;margin-right:8px}
  .warn{background:var(--redsoft);border-left:8px solid var(--accent);padding:22px 24px;font-size:24px;line-height:1.65;font-weight:700;margin:26px 0}
  .axis{position:relative;height:520px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);margin:60px 28px 44px}
  .axis:before,.axis:after{position:absolute;color:var(--muted);font-size:20px}
  .axis:before{content:attr(data-y);left:-18px;top:-42px}
  .axis:after{content:attr(data-x);right:-22px;bottom:-42px}
  .placeholder{position:absolute;inset:90px 90px;background:repeating-linear-gradient(-45deg,#f6f1ea,#f6f1ea 14px,#fff 14px,#fff 28px);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:800;color:var(--accent);line-height:1.35;padding:40px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}
  .legend span{font-size:20px;border:1px solid var(--line);padding:8px 12px;background:#fbfaf6}
  table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:24px}
  th,td{border-bottom:1px solid var(--line);padding:16px 12px;text-align:left;font-size:20px;vertical-align:top;line-height:1.55;word-break:break-word}
  th{border-bottom:3px solid var(--ink);background:var(--soft);font-weight:800}
  .check{font-family:Georgia,serif;color:var(--accent);font-size:28px;font-weight:900}
  .footer{margin-top:34px;border-top:1px solid var(--line);padding-top:18px;font-size:18px;color:var(--muted);line-height:1.6}
  </style></head><body><main class="canvas"><div class="eyebrow">KOREA CUSTOMS · NAND</div><h1>供给侧辅助验证</h1><div class="sub">NAND 单价 vs 日本材料/设备进口。</div>
    <div class="axis" data-y="指数化：2023=100" data-x="月份">
      <div class="placeholder">材料/设备数据待补<br>已确认需另做 HS 清单<br>不能用存储 IC 进口替代</div>
    </div>
    <div class="warn">这张图只做辅助验证：材料/设备进口不能直接等于某家公司扩产。</div>
  <div class="footer">口径：HS 854232 为 Memories 合计代理；纯 NAND HS10 8542321030 仍待 data.go.kr serviceKey 补齐。生成日期：2026-05-19</div></main></body></html>
