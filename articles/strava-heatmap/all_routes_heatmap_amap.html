function outOfChina(lat,lng){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271}
function transformLat(x,y){let ret=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));ret+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;ret+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;ret+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return ret}

function miniProfileSvg(profile){const vals=(profile&&profile.length)?profile:[0,0];const w=520,h=42,p=0;const mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;const pts=vals.map((v,i)=>[i/(Math.max(vals.length-1,1))*w,h-4-(v-mn)/sp*(h-8)]);const line=pts.map(x=>x[0].toFixed(1)+','+x[1].toFixed(1)).join(' ');const area=`0,${h} `+line+` ${w},${h}`;return `<svg viewBox="0 0 ${w} ${h}"><polyline class="area" points="${area}"/><polyline class="line" points="${line}"/></svg>`}
function zwiftHud(s){const grade=Math.round(Math.abs(s.avg_grade||0));return `<div class="zwift-card"><div class="zwift-map">${routeSvg(s)}<div class="zwift-grade">${grade}<span>%</span></div><div class="zwift-profile">${miniProfileSvg(s.elevation_profile)}</div><div class="zwift-footer"><b>${s.name}</b><span>📍 ${s.distance_km}km</span></div></div><div class="zwift-board"><div class="zwift-row"><span>KOM</span><b>${s.kom||'-'}</b><em>${s.kom_gap||''}</em></div><div class="zwift-row me"><span>YOU</span><b>${s.my_pr||s.pr_time||'-'}</b><em>${s.my_effort_count||s.count||'-'}x</em></div><div class="zwift-row"><span>QOM</span><b>${s.qom||'-'}</b><em>${s.elev_gain_m}m</em></div></div></div>`}
function scoreGrid(s){if(!s)return '';const source=s.detail_cached?'官方 segment detail':'本地 activity detail';return `<div class="score-grid"><div class="hot"><b>${s.my_effort_count||s.count||'-'} 次</b><span>我骑过</span></div><div class="hot"><b>${s.my_pr||s.pr_time||'-'}</b><span>我的 PR · ${s.my_pr_date||'-'}</span></div><div><b>${s.kom||'-'}</b><span>KOM · 差距 ${s.kom_gap||'-'}</span></div><div><b>${s.qom||'-'}</b><span>QOM · 全站 ${s.official_effort_count||'-'} 次</span></div></div><div class="detail-note">${source} · ${s.athlete_count?`${s.athlete_count} athletes`:'KOM/QOM 待缓存后自动补齐'}</div>`}
function updateProfile(s){if(!s){profilePanel.querySelector('.profile-title').textContent='海拔图';profilePanel.querySelector('.profile-meta').textContent='当前视野没有赛段';profileChart.innerHTML='';scoreDetail.innerHTML='';return}const vals=s.elevation_profile||[];const min=vals.length?Math.round(Math.min(...vals)):0,max=vals.length?Math.round(Math.max(...vals)):0;profilePanel.querySelector('.profile-title').textContent=s.name;profilePanel.querySelector('.profile-meta').textContent=`${s.distance_km} km · Gain ${s.elev_gain_m}m · ${min}-${max}m`;profileChart.innerHTML=profileSvg(vals);scoreDetail.innerHTML=scoreGrid(s)}
function segHtml(s,i){return `<article class="seg" data-id="${s.id}"><div class="rank">#${i+1}</div><div><h3>${s.name}</h3><p>${s.count} 次经过 / ${s.activity_count} 次活动 · ${s.distance_km} km · ${s.avg_grade}% avg</p><div class="chips"><i>我的 PR ${s.my_pr||s.pr_time||'-'}</i><i>KOM ${s.kom||'-'}</i><i>Gain ${s.elev_gain_m}m</i><a href="segment_view.html?id=${s.id}" target="_blank">详情页</a><a href="https://www.strava.com/segments/${s.id}" target="_blank">Strava Segment</a></div></div>${elevSvg(s.elevation_profile)}</article>`}
function popup(s){return `<h3>${s.name}</h3><div>我骑过 <b>${s.my_effort_count||s.count||'-'} 次</b></div><div>我的 PR <b>${s.my_pr||s.pr_time||'-'}</b></div><div>KOM <b>${s.kom||'-'}</b></div><div>距离 <b>${s.distance_km} km</b></div><div>爬升 <b>${s.elev_gain_m} m</b></div><div><a href="https://www.strava.com/segments/${s.id}" target="_blank">打开 Strava 赛段</a></div>`}
function selectRegion(rid){currentRegion=rid||null;document.querySelectorAll('.region-card').forEach(c=>c.classList.toggle('active',c.dataset.region===rid));document.querySelectorAll('#regionTabs a').forEach(c=>c.classList.toggle('active',c.dataset.region===rid))}
function viewSegments(){const b=activeBounds();return SEGMENTS.filter(s=>s.bounds&&boxIntersects(b,s.bounds))}
function viewTopSegments(){return viewSegments().sort((a,b)=>b.count-a.count||b.activity_count-a.activity_count||b.distance_km-a.distance_km||a.name.localeCompare(b.name)).slice(0,3)}
function updateLegend(items){const source=items||viewSegments();const climbs=source.filter(s=>(s.elev_gain_m||0)>=50||(s.avg_grade||0)>=3);const efforts=source.reduce((sum,s)=>sum+(s.count||0),0);const top=[...source].sort((a,b)=>(b.count||0)-(a.count||0)||a.name.localeCompare(b.name))[0];const topText=top?' / 最高频 '+top.name.slice(0,12)+' '+top.count+'x':'';const el=document.querySelector('.legend');if(el)el.innerHTML='<span class="sw"></span>经过频次：低 → 高 · 当前 '+source.length+' 段 / 爬坡 '+climbs.length+' 段 / 经过 '+efforts+' 次'+topText}
function useBlockMode(){const b=activeBounds();return map.getZoom()<=9||Math.max(b.north-b.south,b.east-b.west)>1.8}
function directionName(lat,lng){const c=map.getCenter();const ns=lat>c.getLat()+.18?'北':lat<c.getLat()-.18?'南':'';const ew=lng>c.getLng()+.18?'东':lng<c.getLng()-.18?'西':'';return (ns+ew)||'中心'}
function blockName(block){const rid=(forcedBounds&&currentRegion)||regionForView();const base=rid&&DATA.regions[rid]?DATA.regions[rid].meta.name:'当前视野';const peak=block.peaks[0];if(peak&&peak.elev_gain_m>=80)return `${base} · ${peak.name.slice(0,12)}`;return `${base} · ${directionName(block.center[0],block.center[1])}热区`}
function buildBlocks(){const b=activeBounds();const items=viewSegments();const latSpan=Math.max(.01,b.north-b.south),lngSpan=Math.max(.01,b.east-b.west);const rows=latSpan>2.5?3:2,cols=lngSpan>2.5?4:3;const groups=new Map();items.forEach(s=>{const lat=s.center[0],lng=s.center[1];const row=Math.max(0,Math.min(rows-1,Math.floor((lat-b.south)/latSpan*rows)));const col=Math.max(0,Math.min(cols-1,Math.floor((lng-b.west)/lngSpan*cols)));const key=`${row}:${col}`;if(!groups.has(key))groups.set(key,{segments:[],count:0,activities:0,km:0,elev:0,minLat:90,minLng:180,maxLat:-90,maxLng:-180,latSum:0,lngSum:0});const g=groups.get(key);g.segments.push(s);g.count+=s.count||0;g.activities+=s.activity_count||0;g.km+=s.distance_km||0;g.elev+=s.elev_gain_m||0;g.latSum+=lat;g.lngSum+=lng;g.minLat=Math.min(g.minLat,s.bounds[0][0]);g.minLng=Math.min(g.minLng,s.bounds[0][1]);g.maxLat=Math.max(g.maxLat,s.bounds[1][0]);g.maxLng=Math.max(g.maxLng,s.bounds[1][1])});return [...groups.values()].filter(g=>g.segments.length>=2).map(g=>{const peaks=[...g.segments].filter(s=>(s.elev_gain_m||0)>=20||(s.max_grade||0)>=4).sort((a,b)=>(b.elev_gain_m-a.elev_gain_m)||(b.max_grade-a.max_grade)||(b.count-a.count)).slice(0,3);const fallback=[...g.segments].sort((a,b)=>b.count-a.count).slice(0,2);const block={...g,peaks:peaks.length?peaks:fallback,center:[g.latSum/g.segments.length,g.lngSum/g.segments.length],bounds:[[g.minLat,g.minLng],[g.maxLat,g.maxLng]]};block.name=blockName(block);return block}).sort((a,b)=>b.count-a.count||b.elev-a.elev).slice(0,3)}
function blockHtml(block,i){const peaks=block.peaks.map(p=>`<i>${p.name.slice(0,18)} · ${p.elev_gain_m}m</i>`).join('');return `<article class="block" data-block="${i}"><div class="block-head"><div><h3>${block.name}</h3><p>${block.segments.length} 个赛段 · ${Math.round(block.km)} km 赛段里程 · ${Math.round(block.elev)} m 赛段爬升</p></div><strong>${block.count}</strong></div><div class="block-peaks">${peaks}</div></article>`}
function drawBlockMarkers(blocks){if(blockMarkers.length)map.remove(blockMarkers);blockMarkers=blocks.map(b=>new AMap.Marker({position:[b.center[1],b.center[0]],content:`<div class="block-marker">${b.name.split('·').pop().trim()}<b>${b.count}</b></div>`,offset:new AMap.Pixel(0,0),zIndex:40}));if(blockMarkers.length)map.add(blockMarkers)}
function clearBlockMarkers(){if(blockMarkers.length)map.remove(blockMarkers);blockMarkers=[]}
function focusBlock(index){const b=currentBlocks[index];if(!b)return;clearSegments();fitBounds(b.bounds);updateProfile(b.peaks[0]);}
function renderViewportSegments(){const visible=viewSegments();updateLegend(visible);if(useBlockMode()){profilePanel.style.display='none';currentBlocks=buildBlocks();document.querySelector('.panel-title').childNodes[0].nodeValue='热区摘要 ';regionLabel.textContent=`${currentBlocks.length} blocks / ${visible.length} segments`;segmentList.innerHTML=currentBlocks.length?currentBlocks.map((b,i)=>blockHtml(b,i)).join(''):`<div class="block"><h3>当前视野没有足够聚合区块</h3><p>放大一点或移动到有热力的位置。</p></div>`;drawBlockMarkers(currentBlocks);document.querySelectorAll('.block[data-block]').forEach(el=>el.onclick=()=>focusBlock(Number(el.dataset.block)));return}profilePanel.style.display='block';clearBlockMarkers();currentBlocks=[];document.querySelector('.panel-title').childNodes[0].nodeValue='Top3 当前视野 ';const items=[...visible].sort((a,b)=>b.count-a.count||b.activity_count-a.activity_count||b.distance_km-a.distance_km||a.name.localeCompare(b.name)).slice(0,3);regionLabel.textContent=`${items.length} / ${SEGMENTS.length}`;segmentList.innerHTML=items.length?items.map((s,i)=>segHtml(s,i)).join(''):`<div class="seg"><div class="rank">-</div><div><h3>当前视野没有官方赛段</h3><p>移动或缩放地图后会自动重算。</p></div><div></div></div>`;if(!preservingSegment)updateProfile(items[0]);document.querySelectorAll('.seg[data-id]').forEach(el=>el.onclick=(ev)=>{if(ev.target.tagName==='A')return;focusSegment(el.dataset.id)})}
function drawRoutes(){if(routeLines.length)map.remove(routeLines);routeLines=[];const b=activeBounds();ROUTES.filter(r=>boxIntersects(b,r.bounds)).slice(0,220).forEach(r=>{if(r.points.length<2)return;const line=new AMap.Polyline({path:lngLatPath(r.points),strokeColor:'#0f766e',strokeOpacity:.42,strokeWeight:2.4,strokeStyle:'solid',lineJoin:'round',lineCap:'round',zIndex:12});routeLines.push(line)});if(routeLines.length)map.add(routeLines)}
function clearSegments(){if(segmentLines.length)map.remove(segmentLines);segmentLines=[]}
function setHeatData(points){activeHeatPoints=points&&points.length?points:HEAT_POINTS;if(heat)heat.setDataSet({data:activeHeatPoints,max:1})}
function focusSegment(id){const s=SEGMENTS.find(x=>String(x.id)===String(id));if(!s||!s.points.length)return;preservingSegment=true;updateProfile(s);document.querySelectorAll('.seg').forEach(e=>e.classList.toggle('active',String(e.dataset.id)===String(id)));clearSegments();const outer=new AMap.Polyline({path:lngLatPath(s.points),strokeColor:'#16a34a',strokeOpacity:.92,strokeWeight:8,lineJoin:'round',lineCap:'round',zIndex:30});const inner=new AMap.Polyline({path:lngLatPath(s.points),strokeColor:'#bbf7d0',strokeOpacity:.98,strokeWeight:3,lineJoin:'round',lineCap:'round',zIndex:31});segmentLines=[outer,inner];map.add(segmentLines);fitBounds(s.bounds);infoWindow.setContent(popup(s));infoWindow.open(map,[s.center[1],s.center[0]]);setTimeout(()=>preservingSegment=false,850)}
function regionForView(){const b=currentBounds();const c=map.getCenter();let best=null,bestScore=0;Object.entries(REGIONS_GCJ).forEach(([id,r])=>{const rb=r.meta.bounds;const inside=c.getLat()>=rb[0][0]&&c.getLat()<=rb[1][0]&&c.getLng()>=rb[0][1]&&c.getLng()<=rb[1][1];const overlap=Math.max(0,Math.min(b.north,rb[1][0])-Math.max(b.south,rb[0][0]))*Math.max(0,Math.min(b.east,rb[1][1])-Math.max(b.west,rb[0][1]));const score=overlap+(inside?999:0);if(score>bestScore){bestScore=score;best=id}});return best}
function focusAll(doFit=true){pinnedRegion='all';selectRegion('all');forcedBounds=overviewBounds();ignoreMapSyncUntil=performance.now()+1800;setHeatData(HEAT_POINTS);renderViewportSegments();drawRoutes();if(doFit){if(!preservingSegment)clearSegments();setTimeout(fitOverview,0);clearTimeout(fallbackTimer);fallbackTimer=setTimeout(scheduleMapSync,1850)}}
function focusRegion(rid,doFit=true){if(rid==='all')return focusAll(doFit);if(!REGIONS_GCJ[rid])return;pinnedRegion=rid;selectRegion(rid);forcedBounds=REGIONS_GCJ[rid].meta.bounds;ignoreMapSyncUntil=performance.now()+1800;setHeatData(REGION_HEAT[rid]);renderViewportSegments();drawRoutes();if(doFit){if(!preservingSegment)clearSegments();setTimeout(()=>fitBounds(REGIONS_GCJ[rid].meta.bounds),0);clearTimeout(fallbackTimer);fallbackTimer=setTimeout(scheduleMapSync,1850);return}}
function releasePinnedRegion(){if(performance.now()>ignoreMapSyncUntil){pinnedRegion=null;forcedBounds=null}}
function syncRegionFromMap(){if(pinnedRegion==='all'){forcedBounds=overviewBounds();selectRegion('all');setHeatData(HEAT_POINTS);if(!preservingSegment)clearSegments();renderViewportSegments();clearTimeout(routeTimer);routeTimer=setTimeout(drawRoutes,80);return}if(pinnedRegion){forcedBounds=REGIONS_GCJ[pinnedRegion].meta.bounds;selectRegion(pinnedRegion);setHeatData(REGION_HEAT[pinnedRegion]);if(!preservingSegment)clearSegments();renderViewportSegments();clearTimeout(routeTimer);routeTimer=setTimeout(drawRoutes,80);return}forcedBounds=null;const rid=regionForView();selectRegion(rid);setHeatData(rid&&REGION_HEAT[rid]?REGION_HEAT[rid]:HEAT_POINTS);if(!preservingSegment)clearSegments();renderViewportSegments();clearTimeout(routeTimer);routeTimer=setTimeout(drawRoutes,80)}
function scheduleMapSync(){clearTimeout(syncTimer);const wait=Math.max(90,ignoreMapSyncUntil-performance.now()+20);syncTimer=setTimeout(syncRegionFromMap,wait)}
function prepareDisplayData(){REGIONS_GCJ=Object.fromEntries(Object.entries(DATA.regions).map(([id,r])=>{const sw=wgsToGcj(r.meta.bounds[0][0],r.meta.bounds[0][1]);const ne=wgsToGcj(r.meta.bounds[1][0],r.meta.bounds[1][1]);return [id,{...r,meta:{...r.meta,bounds:[[sw[0],sw[1]],[ne[0],ne[1]]]}}]}));ROUTES=DATA.routes.map(r=>{const points=gcjPoints(r.points);return {...r,points,bounds:pointBounds(points)}});SEGMENTS=DATA.segments.map(s=>{const points=gcjPoints(s.points||[]);return {...s,points,center:points.length?points[Math.floor(points.length/2)]:s.center,bounds:points.length?pointBounds(points):null}});HEAT_POINTS=DATA.allHeat.map(p=>{const g=wgsToGcj(p[0],p[1]);return {lng:g[1],lat:g[0],count:p[2]}});REGION_HEAT=Object.fromEntries(Object.entries(REGIONS_GCJ).map(([id,r])=>[id,HEAT_POINTS.filter(p=>p.lat>=r.meta.bounds[0][0]&&p.lat<=r.meta.bounds[1][0]&&p.lng>=r.meta.bounds[0][1]&&p.lng<=r.meta.bounds[1][1])]))}
function initMap(){map=new AMap.Map('map',{viewMode:'2D',zoom:10,center:[116.4,39.9],mapStyle:'amap://styles/normal',features:['bg','road','building','point'],resizeEnable:true,showLabel:true,animateEnable:false});infoWindow=new AMap.InfoWindow({offset:new AMap.Pixel(0,-12)});AMap.plugin(['AMap.HeatMap'],()=>{heat=new AMap.HeatMap(map,{radius:20,opacity:[0.08,0.68],zooms:[3,18],gradient:{.18:'#60a5fa',.38:'#22c55e',.68:'#f59e0b',1:'#ef4444'}});setHeatData(activeHeatPoints||HEAT_POINTS)});map.on('dragstart',releasePinnedRegion);map.on('zoomstart',releasePinnedRegion);map.on('moveend',scheduleMapSync);map.on('zoomend',scheduleMapSync);map.on('click',()=>scheduleMapSync());}
async function boot(){if(!HAS_AMAP_KEY||!HAS_AMAP_SECURITY){showNotice(`<h2>缺高德 JS API 配置</h2><p>在 <code>.env</code> 里加入：</p><p><code>AMAP_JSAPI_KEY=你的Web端Key</code></p><p><code>AMAP_SECURITY_JS_CODE=你的安全密钥</code></p><p>然后重新运行 <code>tools/build_strava_heatmap.py</code>。</p>`);return}if(!window.AMap){showNotice('<h2>高德 JS API 没加载成功</h2><p>检查 Key、安全密钥，或当前网络是否能访问 webapi.amap.com。</p>');return}DATA=await fetch('heatmap_data.json?ts=1779317207').then(r=>r.json());sumRides.textContent=DATA.summary.rides;sumKm.textContent=DATA.summary.km;sumElev.textContent=DATA.summary.elevation;regions.innerHTML=Object.entries(DATA.regions).map(([id,r])=>`<a class="region-card" href="#${id}" data-region="${id}"><div class="card-row"><div><h2>${r.meta.name}</h2><p>${r.meta.subtitle}</p></div><span>${r.stats.rides} rides</span></div><div class="nums"><b>${r.stats.km.toFixed(1)}</b><b>${Math.round(r.stats.elevation)}</b><b>${r.stats.max_count}</b></div><div class="labs"><em>区域 km</em><em>总爬升 m</em><em>赛段最高频</em></div></a>`).join('');prepareDisplayData();initMap();window.switchRegion=focusRegion;window.addEventListener('hashchange',()=>{if(suppressHashSync)return;const rid=location.hash.slice(1)||'all';if(rid==='all'||REGIONS_GCJ[rid])focusRegion(rid,true)});document.querySelectorAll('[data-region]').forEach(el=>el.addEventListener('click',ev=>{ev.preventDefault();const rid=el.dataset.region;suppressHashSync=true;history.replaceState(null,'',`#${rid}`);focusRegion(rid,true);setTimeout(()=>suppressHashSync=false,0)}));const initial=location.hash.slice(1)||'all';setTimeout(()=>focusRegion(initial==='all'||REGIONS_GCJ[initial]?initial:'all',true),200);setTimeout(scheduleMapSync,500)}
boot().catch(err=>showNotice(`<h2>页面初始化失败</h2><p>${err.message}</p>`));
</script></body></html>
