<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>北京骑行路线策略器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#edf1f6}.shell{display:grid;grid-template-columns:430px 1fr;min-height:100vh}.sidebar{padding:22px;display:flex;flex-direction:column;gap:14px}.hero,.panel{background:rgba(255,255,255,.9);border:1px solid rgba(15,23,42,.1);border-radius:18px;box-shadow:0 18px 48px rgba(15,23,42,.1);padding:18px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#2563eb;font-weight:900}.hero h1{font-size:34px;line-height:1.05;margin:8px 0 10px}.hero p,.muted{color:#64748b;line-height:1.6;margin:0;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{border:1px solid #e5e7eb;background:#f8fafc;border-radius:12px;padding:11px}.stat b{font-size:23px;display:block}.stat span{font-size:12px;color:#64748b}.route-list{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding-right:4px}.route-card{border:1px solid #e5e7eb;background:#fff;border-radius:14px;padding:13px;cursor:pointer}.route-card.active{border-color:#2563eb;box-shadow:0 10px 26px rgba(37,99,235,.14)}.route-card h2{font-size:17px;line-height:1.2;margin:0}.route-card .meta{font-size:12px;color:#64748b;margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{font-size:11px;font-weight:800;color:#166534;background:#dcfce7;border-radius:999px;padding:4px 8px}.chip.blue{color:#1d4ed8;background:#dbeafe}.map-wrap{position:relative;min-height:100vh}.map{position:fixed;inset:0 0 0 430px}.topbar{position:fixed;z-index:700;left:454px;right:24px;top:22px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;pointer-events:none}.topbar>.panel{pointer-events:auto}.title-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.title-row h2{font-size:25px;margin:0 0 8px}.pill{border-radius:999px;background:#0f172a;color:#fff;padding:7px 11px;font-size:12px;font-weight:900;white-space:nowrap}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.weather{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weather-card{border:1px solid #e5e7eb;background:#f8fafc;border-radius:12px;padding:10px}.weather-card.best{border-color:#16a34a;background:#f0fdf4}.weather-card b{display:block;font-size:15px}.weather-card span{display:block;color:#64748b;font-size:11px;margin-top:3px}.bottom{position:fixed;z-index:710;left:454px;right:24px;bottom:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.segment-list,.plan-list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid #e5e7eb;padding-top:8px}.row:first-child{border-top:0;padding-top:0}.row strong{font-size:14px}.row small{color:#64748b;font-size:12px}.route-line{filter:drop-shadow(0 7px 10px rgba(37,99,235,.22))}.legend{position:fixed;left:454px;bottom:calc(22px + 286px);z-index:720;background:rgba(255,255,255,.9);border:1px solid #e5e7eb;border-radius:999px;padding:9px 12px;font-size:12px;color:#475569}.sw{display:inline-block;width:58px;height:9px;border-radius:999px;background:linear-gradient(90deg,#2563eb,#22c55e,#f59e0b);margin-right:8px}@media(max-width:980px){.shell{display:block}.sidebar{padding:14px}.map{position:relative;inset:auto;height:48vh}.topbar,.bottom,.legend{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:14px;grid-template-columns:1fr}.route-list{max-height:none}.hero h1{font-size:28px}.detail-grid,.weather{grid-template-columns:repeat(2,1fr)}} 
</style>
</head>
<body>
<main class="shell">
  <aside class="sidebar">
    <section class="hero">
      <div class="eyebrow">Strava Route Planner · MVP</div>
      <h1>北京路线策略器</h1>
      <p>从你骑过的北京路线和高频赛段里挑路线，生成天气窗口、路段计划和功率估算。当前是最小可用版。</p>
      <div class="stats">
        <div class="stat"><b id="totalRides">-</b><span>北京骑行</span></div>
        <div class="stat"><b id="totalKm">-</b><span>北京 km</span></div>
        <div class="stat"><b id="routeCount">-</b><span>候选路线</span></div>
      </div>
    </section>
    <section class="panel">
      <div class="eyebrow">Popular Routes</div>
      <div class="route-list" id="routeList"></div>
    </section>
  </aside>
  <section class="map-wrap">
    <div id="map" class="map"></div>
    <div class="topbar">
      <section class="panel">
        <div class="title-row"><div><h2 id="routeTitle">-</h2><p class="muted" id="routeDesc"></p></div><span class="pill" id="routeType">-</span></div>
        <div class="detail-grid stats">
          <div class="stat"><b id="routeKm">-</b><span>km</span></div>
          <div class="stat"><b id="routeGain">-</b><span>爬升 m</span></div>
          <div class="stat"><b id="routeDir">-</b><span>主方向</span></div>
          <div class="stat"><b id="routeTime">-</b><span>预计用时</span></div>
        </div>
      </section>
      <section class="panel">
        <div class="eyebrow">Weather Window</div>
        <div class="weather" id="weatherBox"><p class="muted">选择路线后加载天气。</p></div>
      </section>
    </div>
    <div class="legend"><span class="sw"></span>蓝色路线 · 绿色关键赛段 · 橙色采样点</div>
    <div class="bottom">
      <section class="panel">
        <div class="eyebrow">Key Segments</div>
        <div class="segment-list" id="segments"></div>
      </section>
      <section class="panel">
        <div class="eyebrow">Pacing Plan</div>
        <div class="plan-list" id="plan"></div>
      </section>
    </div>
  </section>
</main>
<script>
const map=L.map('map',{zoomControl:false,preferCanvas:true});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:['1','2','3','4'],maxZoom:18,attribution:'&copy; AutoNavi'}).addTo(map);
const routeLayer=L.layerGroup().addTo(map);
const pointLayer=L.layerGroup().addTo(map);
let DATA, ACTIVE;
const $=(id)=>document.getElementById(id);
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function dirText(deg){const names=['北','东北','东','东南','南','西南','西','西北'];return names[Math.round(deg/45)%8]}
function cardHtml(r){return '<article class="route-card" data-id="'+r.id+'"><h2>'+r.name+'</h2><div class="meta">'+r.area+' · '+r.km+' km · Gain '+fmt(r.gain_m)+' m</div><div class="chips"><span class="chip blue">'+r.type+'</span><span class="chip">'+r.key_segments.length+' key segments</span><span class="chip">FTP '+r.plan.ftp_assumption+'W</span></div></article>'}
function row(title,value,note){return '<div class="row"><div><strong>'+title+'</strong><br><small>'+note+'</small></div><b>'+value+'</b></div>'}
function fitBounds(bounds){map.fitBounds([[bounds[0][0],bounds[0][1]],[bounds[1][0],bounds[1][1]]],{padding:[80,80]})}
function renderRoute(id){const r=DATA.routes.find(x=>x.id===id)||DATA.routes[0];ACTIVE=r;document.querySelectorAll('.route-card').forEach(el=>el.classList.toggle('active',el.dataset.id===r.id));$('routeTitle').textContent=r.name;$('routeDesc').textContent=r.area+' · 基于真实骑行轨迹和高频 Strava 赛段生成';$('routeType').textContent=r.type;$('routeKm').textContent=r.km;$('routeGain').textContent=fmt(r.gain_m);$('routeDir').textContent=dirText(r.direction_deg);$('routeTime').textContent=r.plan.estimated_time;
routeLayer.clearLayers();pointLayer.clearLayers();L.polyline(r.points,{color:'#0f172a',weight:8,opacity:.45,className:'route-line'}).addTo(routeLayer);L.polyline(r.points,{color:'#2563eb',weight:4,opacity:.96}).addTo(routeLayer);for(const s of r.key_segments.slice(0,5)){if(s.center)L.circleMarker(s.center,{radius:6,color:'#166534',fillColor:'#22c55e',fillOpacity:.9,weight:2}).bindTooltip(s.name).addTo(pointLayer)}for(const p of r.sample_points){L.circleMarker(p,{radius:4,color:'#ea580c',fillColor:'#fb923c',fillOpacity:.9,weight:1}).addTo(pointLayer)}fitBounds(r.bounds);
$('segments').innerHTML=r.key_segments.slice(0,5).map((s,i)=>row('#'+(i+1)+' '+s.name,s.count+'x',s.distance_km+' km · Gain '+s.gain_m+'m · PR '+s.pr_time)).join('')||'<p class="muted">暂无关键赛段。</p>';
$('plan').innerHTML=r.plan.sections.map(s=>row(s.name,s.target,s.note)).join('')+'<p class="muted" style="margin-top:10px">'+r.plan.style+'</p>';
loadWeather(r);
}
function nextSlots(){const now=new Date();const hours=[7,9,15];const out=[];for(let d=0;d<3;d++){for(const h of hours){const t=new Date(now);t.setDate(now.getDate()+d);t.setHours(h,0,0,0);if(t>now)out.push(t)}}return out.slice(0,3)}
function hourKey(d){return d.toISOString().slice(0,13)+':00'}
function windLabel(head){if(head>3)return '逆风';if(head<-3)return '顺风';return '侧风'}
async function loadWeather(route){$('weatherBox').innerHTML='<p class="muted">加载 Open-Meteo 路线天气...</p>';try{const pts=route.sample_points.slice(0,8);const lat=pts.map(p=>p[0].toFixed(4)).join(',');const lng=pts.map(p=>p[1].toFixed(4)).join(',');const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_direction_10m&forecast_days=3&timezone=Asia%2FShanghai';const res=await fetch(url);if(!res.ok)throw new Error('weather '+res.status);const raw=await res.json();const arr=Array.isArray(raw)?raw:[raw];const cards=nextSlots().map(slot=>scoreSlot(slot,arr,route));cards.sort((a,b)=>b.score-a.score);$('weatherBox').innerHTML=cards.map((c,i)=>'<div class="weather-card '+(i===0?'best':'')+'"><b>'+c.label+'</b><span>'+c.temp+'°C · '+c.rain+'% 雨</span><span>'+c.wind+' km/h · '+c.windType+'</span><span>评分 '+c.score+'/100</span></div>').join('')}catch(e){$('weatherBox').innerHTML='<div class="weather-card best"><b>天气暂不可用</b><span>保留路线计划</span><span>后续可接 Open-Meteo 后端缓存</span></div>'}}
function scoreSlot(slot,arr,route){let temps=[],rains=[],winds=[],heads=[];const key=hourKey(slot);for(const p of arr){const times=p.hourly.time.map(t=>t.replace('T',' '));const target=key.replace('T',' ');let idx=times.findIndex(t=>t.startsWith(target.slice(0,13)));if(idx<0)idx=0;const temp=p.hourly.temperature_2m[idx]||0;const rain=p.hourly.precipitation_probability[idx]||0;const ws=p.hourly.wind_speed_10m[idx]||0;const wd=p.hourly.wind_direction_10m[idx]||0;const head=ws*Math.cos((wd-route.direction_deg)*Math.PI/180);temps.push(temp);rains.push(rain);winds.push(ws);heads.push(head)}const avg=a=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length);const max=a=>Math.max(...a,0);const temp=Math.round(avg(temps));const rain=Math.round(max(rains));const wind=Math.round(avg(winds));const head=Math.round(avg(heads));const score=Math.max(20,Math.round(100-rain*.45-Math.max(0,wind-18)*1.2-Math.max(0,head)*1.5-Math.max(0,temp-30)*2));return{label:slot.toLocaleString('zh-CN',{weekday:'short',hour:'2-digit',minute:'2-digit'}),temp,rain,wind,windType:windLabel(head),score}}
fetch('route_planner_data.json?ts='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;$('totalRides').textContent=d.city.summary.rides;$('totalKm').textContent=fmt(d.city.summary.km);$('routeCount').textContent=d.routes.length;$('routeList').innerHTML=d.routes.map(cardHtml).join('');document.querySelectorAll('.route-card').forEach(el=>el.onclick=()=>renderRoute(el.dataset.id));renderRoute(d.routes[0].id)});
</script>
</body>
</html>
