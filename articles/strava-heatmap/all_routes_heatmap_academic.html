<style>

6px;pointer-events:none}.north:before{content:"N";position:absolute;left:20px;top:0;font-weight:900;font-size:18px}.north:after{content:"";position:absolute;left:16px;top:24px;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:58px solid #111827;filter:drop-shadow(0 1px 0 white)}.ticks{position:fixed;inset:22px;z-index:30;pointer-events:none;color:#334155;font-weight:800;font-size:13px}.ticks .top{position:absolute;top:-20px;transform:translateX(-50%)}.ticks .left{position:absolute;left:-36px;transform:translateY(-50%) rotate(-90deg);transform-origin:center}.inset{position:fixed;right:54px;bottom:54px;z-index:31;width:168px;height:130px;background:rgba(255,255,255,.9);border:1.5px solid rgba(17,24,39,.72);box-shadow:0 10px 26px rgba(15,23,42,.14);padding:8px}.inset .mini{height:92px;background:linear-gradient(135deg,#f8fafc,#dbeafe);border:1px solid #cbd5e1;position:relative;overflow:hidden}.mini i{position:absolute;width:5px;height:5px;border-radius:50%;background:#155b96;opacity:.75}.inset b{display:block;margin-top:5px;text-align:center;font-size:10px;letter-spacing:.08em}.stats{position:fixed;right:54px;top:54px;z-index:31;width:280px;background:rgba(255,255,255,.88);border:1px solid rgba(17,24,39,.18);padding:12px 14px;box-shadow:0 12px 32px rgba(15,23,42,.12);pointer-events:auto}.stats h2{font-size:16px;margin:0 0 8px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{border-top:1px solid #cbd5e1;padding-top:7px}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:#64748b}.callouts{position:fixed;right:54px;top:225px;z-index:31;width:280px;display:grid;gap:8px;pointer-events:auto}.callout{background:rgba(255,255,255,.86);border:1px solid rgba(17,24,39,.14);padding:10px 12px;box-shadow:0 10px 26px rgba(15,23,42,.1);cursor:pointer}.callout h3{font-size:14px;margin:0 0 4px}.callout p{font-size:11px;color:#475569;margin:0;line-height:1.45}.notice{position:fixed;z-index:99;left:50%;top:50%;transform:translate(-50%,-50%);background:white;border:1px solid #cbd5e1;padding:22px;width:min(520px,calc(100vw - 40px));box-shadow:0 24px 70px rgba(15,23,42,.2)}.density-label{background:rgba(255,255,255,.86);border:1px solid rgba(15,23,42,.22);padding:4px 7px;font:800 11px Arial;color:#0f172a;box-shadow:0 5px 14px rgba(15,23,42,.12);white-space:nowrap}.amap-layer canvas{filter:grayscale(.95) saturate(.18) contrast(1.08) brightness(1.06)}@media(max-width:900px){.frame{inset:10px}.title{left:18px;right:18px;top:20px;width:auto}.title h1{font-size:24px}.north,.ticks,.inset,.stats{display:none}.legend{left:18px;bottom:18px;width:230px}.callouts{display:none}}
</style><script>window._AMapSecurityConfig={securityJsCode:"6841defa4dce0d2758f456d8238bce69"};</script><script src="https://webapi.amap.com/maps?v=2.0&key=8c289ef25496fc355abc65e0153b80dc&plugin=AMap.HeatMap"></script></head><body><div id="map"></div><div class="frame"></div><section class="title"><div class="eyebrow">STRAVA ROUTE ATLAS · ACADEMIC PLATE</div><h1>骑过区域分级热力图</h1><p>灰白地形底图只做参照；黄橘分级区块只来自真实骑过的路线点。没有骑过的地方不铺色。</p><nav class="tabs" id="tabs"><a href="#all" data-region="all">全域</a><a href="#beijing" data-region="beijing">北京</a><a href="#hongkong" data-region="hongkong">香港</a><a href="#yunnan" data-region="yunnan">云南</a><a href="#wuhan" data-region="wuhan">武汉</a><a class="dark" href="all_routes_heatmap_amap.html">返回交互热图</a></nav></section><aside class="stats"><h2 id="statTitle">全域统计</h2><div class="stat-grid"><div class="stat"><b id="cellCount">-</b><span>colored cells</span></div><div class="stat"><b id="routeCount">-</b><span>route lines</span></div><div class="stat"><b id="rideCount">-</b><span>outdoor rides</span></div><div class="stat"><b id="segmentCount">-</b><span>segments</span></div></div></aside><aside class="callouts" id="callouts"></aside><aside class="legend"><h2>Ride density class</h2><div id="legendRows"></div><div class="scale"></div></aside><div class="north"></div><div class="ticks"><span class="top" style="left:14%">70°E</span><span class="top" style="left:42%">95°E</span><span class="top" style="left:70%">120°E</span><span class="top" style="left:94%">145°E</span><span class="left" style="top:22%">45°N</span><span class="left" style="top:52%">30°N</span><span class="left" style="top:82%">15°N</span></div><aside class="inset"><div class="mini" id="mini"></div><b>NANHAI / HK INSET</b></aside><script>
const HAS_AMAP=!!window.AMap;
const COLORS=['#fff7cc','#fee58f','#fbbf57','#f97316','#c2410c'];
let DATA,map,polys=[],routeLines=[],markers=[],current='all';
function showNotice(html){document.body.insertAdjacentHTML('beforeend',`<div class="notice">${html}</div>`)}
function outOfChina(lat,lng){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271}
function transformLat(x,y){let ret=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));ret+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;ret+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;ret+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return ret}
function transformLng(x,y){let ret=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));ret+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;ret+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;ret+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return ret}
function wgsToGcj(lat,lng){if(outOfChina(lat,lng))return [lat,lng];const a=6378245,ee=.00669342162296594323;let dLat=transformLat(lng-105,lat-35),dLng=transformLng(lng-105,lat-35);const radLat=lat/180*Math.PI;let magic=Math.sin(radLat);magic=1-ee*magic*magic;const sqrtMagic=Math.sqrt(magic);dLat=(dLat*180)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);dLng=(dLng*180)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);return [lat+dLat,lng+dLng]}
function gcjPoints(points){return points.map(p=>wgsToGcj(p[0],p[1]))}
function lngLatPath(points){return points.map(p=>[p[1],p[0]])}
function pointBounds(points){return [[Math.min(...points.map(p=>p[0])),Math.min(...points.map(p=>p[1]))],[Math.max(...points.map(p=>p[0])),Math.max(...points.map(p=>p[1]))]]}
function inBox(p,b){return p.lat>=b[0][0]&&p.lat<=b[1][0]&&p.lng>=b[0][1]&&p.lng<=b[1][1]}
function boxIntersects(a,b){return Math.max(a[0][0],b[0][0])<=Math.min(a[1][0],b[1][0])&&Math.max(a[0][1],b[0][1])<=Math.min(a[1][1],b[1][1])}
function fitBounds(bounds){map.setBounds(new AMap.Bounds([bounds[0][1],bounds[0][0]],[bounds[1][1],bounds[1][0]]),true,[56,72,56,72])}
function regionData(){return DATA.regions[current]||DATA.regions.all}
function activeBounds(){return regionData().bounds}
function displayBounds(){return regionData().bounds}
function gridStep(){if(current==='all')return .82;if(current==='yunnan')return .14;if(current==='hongkong')return .026;return .07}
function classFor(v,breaks){for(let i=0;i<breaks.length;i++){if(v<=breaks[i])return i}return COLORS.length-1}
function clearMap(){if(polys.length)map.remove(polys);if(routeLines.length)map.remove(routeLines);if(markers.length)map.remove(markers);polys=[];routeLines=[];markers=[]}
function makeCells(){return regionData().cells||[]}
function drawCells(){const cells=makeCells();polys=cells.map(c=>new AMap.Polygon({path:[[c.bounds[0][1],c.bounds[0][0]],[c.bounds[1][1],c.bounds[0][0]],[c.bounds[1][1],c.bounds[1][0]],[c.bounds[0][1],c.bounds[1][0]]],strokeColor:'#f8fafc',strokeWeight:.7,strokeOpacity:.72,fillColor:COLORS[c.cls],fillOpacity:.78,zIndex:14}));if(polys.length)map.add(polys);cellCount.textContent=String(cells.length);return cells}
function drawRoutes(){routeCount.textContent=String(regionData().stats.route_count||0)}
function drawLabels(){const region=regionData();const segs=region.callouts||[];markers=(region.markers||[]).map(s=>new AMap.Marker({position:[s.center[1],s.center[0]],content:`<div class="density-label">${s.name.slice(0,14)} <b>${s.count}</b></div>`,offset:new AMap.Pixel(-20,-14),zIndex:50}));if(markers.length)map.add(markers);callouts.innerHTML=segs.map(s=>`<article class="callout" data-id="${s.id}"><h3>${s.name}</h3><p>${s.count} 次经过 · ${s.distance_km} km · Gain ${s.elev_gain_m}m · PR ${s.my_pr||'-'}</p></article>`).join('');callouts.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>location.href=`segment_view.html?id=${el.dataset.id}`);segmentCount.textContent=String(region.stats.segment_count||0)}
function drawLegend(){legendRows.innerHTML=COLORS.map((c,i)=>`<div class="legend-row"><span class="box" style="background:${c}"></span><span>${i===0?'very low':i===4?'very high':'class '+(i+1)}</span></div>`).join('')+'<div class="legend-row"><span class="box" style="background:#f8fafc"></span><span>not ridden / reference only</span></div>'}
function drawMini(){mini.innerHTML='';(DATA.mini||[]).forEach(p=>mini.insertAdjacentHTML('beforeend',`<i style="left:${p.x}px;top:${p.y}px"></i>`));}
function setRegion(rid){current=DATA.regions[rid]?rid:'all';const region=regionData();document.querySelectorAll('[data-region]').forEach(a=>a.classList.toggle('active',a.dataset.region===current));clearMap();fitBounds(region.bounds);setTimeout(()=>{drawCells();drawRoutes();drawLabels();},120);statTitle.textContent=(current==='all'?'全域':region.name)+'统计';rideCount.textContent=String(region.stats.rides||DATA.summary.rides);cellCount.textContent=String(region.stats.cell_count||0);routeCount.textContent=String(region.stats.route_count||0);segmentCount.textContent=String(region.stats.segment_count||0)}
function prepare(raw){DATA=raw}
async function boot(){if(!HAS_AMAP){showNotice('<h2>高德地图未加载</h2><p>检查 Web Key / 安全密钥，或网络是否能访问 webapi.amap.com。</p>');return}const raw=await fetch('academic_data.json?ts=1779235361').then(r=>r.json());prepare(raw);map=new AMap.Map('map',{viewMode:'2D',zoom:4,center:[104.5,34.5],mapStyle:'amap://styles/normal',features:['bg','road','building','point'],resizeEnable:true,showLabel:true,animateEnable:false});drawLegend();drawMini();document.querySelectorAll('[data-region]').forEach(a=>a.onclick=e=>{e.preventDefault();history.replaceState(null,'','#'+a.dataset.region);setRegion(a.dataset.region)});setRegion(location.hash.slice(1)||'all')}
boot().catch(err=>showNotice('<h2>页面初始化失败</h2><p>'+err.message+'</p>'));
</script></body></html>
