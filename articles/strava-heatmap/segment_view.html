function outOfChina(lat,lng){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271}
function transformLat(x,y){let ret=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));ret+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;ret+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;ret+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return ret}
function transformLng(x,y){let ret=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));ret+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;ret+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;ret+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return ret}
function wgsToGcj(lat,lng){if(outOfChina(lat,lng))return [lat,lng];const a=6378245,ee=.00669342162296594323;let dLat=transformLat(lng-105,lat-35),dLng=transformLng(lng-105,lat-35);const radLat=lat/180*Math.PI;let magic=Math.sin(radLat);magic=1-ee*magic*magic;const sqrtMagic=Math.sqrt(magic);dLat=(dLat*180)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);dLng=(dLng*180)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);return [lat+dLat,lng+dLng]}

function routeWallSvg(s){const points=samplePoints(s.points||[],360);if(points.length<2)return '<div class="status">这个赛段没有可用路线点。</div>';const elev=resample((s.elevation_profile||[]).map(Number),points.length);const minLat=Math.min(...points.map(p=>p[0])),maxLat=Math.max(...points.map(p=>p[0]));const minLng=Math.min(...points.map(p=>p[1])),maxLng=Math.max(...points.map(p=>p[1]));const minE=Math.min(...elev),maxE=Math.max(...elev),spanE=maxE-minE||1;const raw=points.map((p,i)=>{const x=((p[1]-minLng)/((maxLng-minLng)||1)-.5)*1.9;const y=((p[0]-minLat)/((maxLat-minLat)||1)-.5)*1.35;const baseX=450+x*300+y*185;const baseY=260+y*145-x*72;const z=(elev[i]-minE)/spanE*145;return {baseX,baseY,topX:baseX,topY:baseY-z,e:elev[i]}});const minX=Math.min(...raw.map(p=>p.topX),...raw.map(p=>p.baseX)),maxX=Math.max(...raw.map(p=>p.topX),...raw.map(p=>p.baseX));const minY=Math.min(...raw.map(p=>p.topY),...raw.map(p=>p.baseY)),maxY=Math.max(...raw.map(p=>p.topY),...raw.map(p=>p.baseY));const scale=Math.min(820/((maxX-minX)||1),310/((maxY-minY)||1),1.15);const pts=raw.map(p=>({baseX:60+(p.baseX-minX)*scale,baseY:70+(p.baseY-minY)*scale,topX:60+(p.topX-minX)*scale,topY:70+(p.topY-minY)*scale,e:p.e}));const grid=[0,1,2,3,4].map(i=>`<line class="route-wall-grid" x1="${80+i*170}" y1="44" x2="${205+i*170}" y2="374"/><line class="route-wall-grid" x1="70" y1="${92+i*70}" x2="835" y2="${52+i*70}"/>`).join('');let walls='',top='',fences='';for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];const grade=(b.e-a.e)/(Math.max(0.03,(Number(s.distance_km)||1)/(pts.length-1)*1000))*100;const c=gradeColor(grade);if(i%5===0)fences+=`<line class="route-wall-fence" x1="${a.topX.toFixed(1)}" y1="${a.topY.toFixed(1)}" x2="${a.baseX.toFixed(1)}" y2="${a.baseY.toFixed(1)}"/>`;walls+=`<polygon points="${a.topX.toFixed(1)},${a.topY.toFixed(1)} ${b.topX.toFixed(1)},${b.topY.toFixed(1)} ${b.baseX.toFixed(1)},${b.baseY.toFixed(1)} ${a.baseX.toFixed(1)},${a.baseY.toFixed(1)}" fill="${c}" opacity=".18"/>`;top 15"/><rect x="0" y="66" width="18" height="22" fill="#22c55e"/><rect x="0" y="88" width="18" height="22" fill="#22d3ee"/><text x="24" y="12">14%+</text><text x="24" y="56">3%</text><text x="24" y="80">0%</text><text x="24" y="102">down</text></g></svg>`}
function profileSvg(vals,mode='big'){vals=(vals&&vals.length)?vals:[0,0];const w=900,h=260,p=32;const mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;const pts=vals.map((v,i)=>[p+i/(Math.max(vals.length-1,1))*(w-2*p),h-p-(v-mn)/sp*(h-2*p)]);const line=pts.map(x=>x[0].toFixed(1)+','+x[1].toFixed(1)).join(' ');const area=`${p},${h-p} `+line+` ${w-p},${h-p}`;const klass=mode==='mini'?'mini-profile':'profile-svg';const labels=mode==='mini'?'':`<text x="${p}" y="${p-8}">${Math.round(mx)}m</text><text x="${p}" y="${h-8}">${Math.round(mn)}m</text>`;return `<svg viewBox="0 0 ${w} ${h}" class="${klass}"><line class="grid" x1="${p}" y1="${p}" x2="${w-p}" y2="${p}"/><line class="grid" x1="${p}" y1="${h/2}" x2="${w-p}" y2="${h/2}"/><line class="axis" x1="${p}" y1="${p}" x2="${p}" y2="${h-p}"/><line class="axis" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><polyline class="area" points="${area}"/><polyline class="line" points="${line}"/>${labels}</svg>`}

sideHtml=function(s){const est2=estimateMinutes(s,2),est3=estimateMinutes(s,3),est4=estimateMinutes(s,4);return `<div class="side-block dark"><h2>Route Basics</h2><p><b>Length:</b> ${s.distance_km} km</p><p><b>Elevation:</b> ${s.elev_gain_m} m</p><p><b>Avg / Max:</b> ${s.avg_grade}% / ${s.max_grade}%</p><p><b>Type:</b> Strava Segment</p></div><div class="side-block"><h3>AI Metrics</h3><p><b>Rating:</b> ${rating(s)}/100</p><p><b>My PR:</b> ${s.my_pr||s.pr_time||'-'}</p><p><b>Attempts:</b> ${s.my_effort_count||s.count||'-'} 次</p><p><b>Official:</b> ${s.detail_cached?'cached':'pending'}</p></div><div class="side-block"><h3>AP / Time Estimates</h3><table class="score-table"><tr><th>${apWatts(2)}W</th><td>${est2} min</td></tr><tr><th>${apWatts(3)}W</th><td>${est3} min</td></tr><tr><th>${apWatts(4)}W</th><td>${est4} min</td></tr></table></div><div class="side-block"><h3>Leaderboard</h3><div class="leaderboard-grid"><a class="leader-box" href="https://www.strava.com/segments/${s.id}" target="_blank"><strong>KOM</strong><b>${s.kom||'-'}</b><span>${s.kom_gap?`You +${s.kom_gap}`:'Official best'}</span></a><a class="leader-box" href="https://www.strava.com/segments/${s.id}" target="_blank"><strong>QOM</strong><b>${s.qom||'-'}</b><span>Women best</span></a></div><a href="https://www.strava.com/segments/${s.id}" target="_blank">Open Strava Segment</a></div><div class="side-block"><h3>Personal</h3><p><span class="badge">YOU ${s.my_pr||s.pr_time||'-'}</span></p><p>KOM gap: ${s.kom_gap||'-'}</p><p>Activities: ${s.activity_count||'-'}</p></div>`}
function renderHighlights(s){const steep=Number(s.max_grade||0)>=8?'最大坡度会突然抬头，冲刺时更吃变速和踏频。':'坡度变化温和，核心胜负更多来自出弯后的速度保持。';const density=(s.official_effort_count||0)>10000?`官方累计 ${s.official_effort_count} 次通过，是高频赛段。`:'官方通过次数不高，更像个人路线里的局部检查点。';insightRow.innerHTML=`<div class="insight"><div class="insight-top"><div class="avatar kom">K</div><div><h3>KOM Reference</h3><b>${s.kom||'-'}</b></div></div><p>当前男子标杆成绩。你的 PR ${s.my_pr||s.pr_time||'-'}，相对 KOM ${s.kom_gap||'-'}，适合用作短冲目标。</p></div><div class="insight"><div class="insight-top"><div class="avatar qom">Q</div><div><h3>QOM Reference</h3><b>${s.qom||'-'}</b></div></div><p>当前女子标杆成绩。后续如果拉到 Strava 头像字段，这里可以替换成真实头像和名字。</p></div><div class="insight"><div class="insight-top"><div class="avatar you">Y</div><div><h3>Segment Notes</h3><b>${s.distance_km} km · ${s.elev_gain_m} m</b></div></div><p>${steep} ${density}</p></div>`}
function describe(s){const dist=Number(s.distance_km)||0,gain=Number(s.elev_gain_m)||0,grade=Number(s.avg_grade)||0,maxg=Number(s.max_grade)||0;const steep=maxg>=12?'会有明显陡坡，适合单独留体力冲刺':grade>=3?'整体是持续上行，节奏比爆发更重要':'坡度不算凶，但很适合作为重复刷成绩的短段';desc1.textContent=`${s.name} 是一条 ${dist} km 的赛段，累计爬升约 ${gain} m，平均坡度 ${grade}%。${steep}。`;desc2.textContent=`按本地骑行记录统计，你经过过 ${s.my_effort_count||s.count||'-'} 次，个人 PR 是 ${s.my_pr||s.pr_time||'-'}。右侧 AP 预估用距离、爬升和坡度做粗略换算，不替代功率计数据，但适合快速判断这段路的体感成本。`;desc3.textContent=`如果后续把更多 Strava streams 缓存进来，这里可以继续补真实配速、分段坡度、心率和功率分布，页面就会更接近完整的 Strava/Veloviewer 路线页。`}
function drawScreenRoute(amap,path){const holder=document.getElementById('map');if(!holder||path.length<2)return;let svg=holder.querySelector('.map-route-overlay');if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('map-route-overlay');holder.appendChild(svg)}const update=()=>{const box=holder.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);const pts=path.map(ll=>amap.lngLatToContainer(ll)).filter(Boolean);if(pts.length<2)return;const d=pts.map((p,i)=>`${i?'L':'M'}${Number(p.x).toFixed(1)},${Number(p.y).toFixed(1)}`).join(' ');svg.innerHTML=`<path class="route-shadow" d="${d}"/><path class="route-main" d="${d}"/>`};['complete','mapmove','zoomchange','rotatechange','pitchchange','resize'].forEach(evt=>amap.on(evt,update));requestAnimationFrame(update);setTimeout(update,350);setTimeout(update,1200)}
function streamPoints(s){if(s.stream_points&&s.stream_points.length>1)return s.stream_points;const pts=s.points||[],profile=s.elevation_profile||[];if(pts.length<2)return [];return pts.map((p,i)=>{const alt=profile.length?profile[Math.min(profile.length-1,Math.round(i*(profile.length-1)/Math.max(1,pts.length-1)))]:0;const dist=(Number(s.distance_km)||0)*1000*i/Math.max(1,pts.length-1);return [p[0],p[1],Number(alt)||0,dist]})}
function streamProfile(s){const vals=streamPoints(s).map(p=>Number(p[2])).filter(Number.isFinite);return vals.length>1?vals:(s.elevation_profile||[])}
function streamPath(points){return points.map(p=>{const g=wgsToGcj(Number(p[0]),Number(p[1]));return [g[1],g[0]]})}
function boundsOfPoints(points){if(!points||!points.length)return null;return {south:Math.min(...points.map(p=>p[0])),west:Math.min(...points.map(p=>p[1])),north:Math.max(...points.map(p=>p[0])),east:Math.max(...points.map(p=>p[1]))}}
function expandBox(b,ratio=.22){if(!b)return null;const lat=Math.max(.01,b.north-b.south),lng=Math.max(.01,b.east-b.west);return {south:b.south-lat*ratio,west:b.west-lng*ratio,north:b.north+lat*ratio,east:b.east+lng*ratio}}
function intersectsBox(a,b){return a&&b&&Math.max(a.south,b.south)<=Math.min(a.north,b.north)&&Math.max(a.west,b.west)<=Math.min(a.east,b.east)}
function segmentBounds(s){const box=s.bounds?{south:s.bounds[0][0],west:s.bounds[0][1],north:s.bounds[1][0],east:s.bounds[1][1]}:boundsOfPoints((s.points||[]));return expandBox(box,Number(s.distance_km)>40?.08:.35)}
function contextRoutes(data,s){const box=segmentBounds(s);if(!box||!data.routes)return [];return data.routes.filter(r=>r.points&&r.points.length>2&&intersectsBox(boundsOfPoints(r.points),box)).sort((a,b)=>(b.distance_km||0)-(a.distance_km||0)).slice(0,8)}
function meters(a,b){const R=6371000,toRad=x=>x*Math.PI/180;const dLat=toRad(b[0]-a[0]),dLng=toRad(b[1]-a[1]);const lat1=toRad(a[0]),lat2=toRad(b[0]);const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nearestIndex(points,target){let best=0,bestM=Infinity;points.forEach((p,i)=>{const m=meters(p,target);if(m<bestM){best=i;bestM=m}});return {idx:best,meters:bestM}}
function routeSliceForSegment(data,s){const ends=s.points||[];if(ends.length<2||!data.routes)return [];let best=null;const maxNear=Math.max(900,Math.min(8000,(Number(s.distance_km)||1)*260));for(const r of data.routes){if(!r.points||r.points.length<4)continue;const box=segmentBounds(s);if(box&&!intersectsBox(boundsOfPoints(r.points),expandBox(box,.6)))continue;const a=nearestIndex(r.points,ends[0]),b=nearestIndex(r.points,ends[ends.length-1]);const lo=Math.min(a.idx,b.idx),hi=Math.max(a.idx,b.idx);if(hi-lo<3||a.meters>maxNear||b.meters>maxNear)continue;const slice=r.points.slice(lo,hi+1);const score=a.meters+b.meters+Math.abs((Number(s.distance_km)||0)*1000-routeDistance(slice))*.08;if(!best||score<best.score)best={score,slice}}return best?best.slice:[]}
function routeDistance(points){let total=0;for(let i=1;i<points.length;i++)total+=meters(points[i-1],points[i]);return total}
function visualStreamPoints(s,data){const direct=streamPoints(s);if(direct.length>2)return direct;const slice=routeSliceForSegment(data,s);if(slice.length<3)return direct;const profile=resample((s.elevation_profile||[]).map(Number),slice.length);const total=Math.max(1,routeDistance(slice));let dist=0;return slice.map((p,i)=>{if(i)dist+=meters(slice[i-1],p);const alt=profile.length?profile[i]:0;return [p[0],p[1],alt,dist/total*(Number(s.distance_km)||total/1000)*1000]})}
function gradeBucket(grade){if(grade<-3)return '#38bdf8';if(grade<3)return '#22c55e';if(grade<7)return '#facc15';if(grade<12)return '#f97316';return '#dc2626'}
function gradeGroups(points){const groups=[];let current=null;for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1];const deltaDist=Math.max(1,Number(b[3])-Number(a[3]));const grade=(Number(b[2])-Number(a[2]))/deltaDist*100;const color=gradeBucket(grade);const path=streamPath([a,b]);if(!current||current.color!==color){current={color,path:[path[0],path[1]]};groups.push(current)}else current.path.push(path[1])}return groups.filter(g=>g.path.length>1)}
function fallbackRouteWall(s){const holder=document.getElementById('map');holder.innerHTML=routeWallSvg(s)}
function startMarker(){return '<div style="width:18px;height:18px;border-radius:50%;background:#84cc16;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>'}
function finishMarker(){return '<div style="width:17px;height:17px;background:#ef4444;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>'}
async function drawAmapSegment(s,data){const pts=samplePoints(visualStreamPoints(s,data),900);if(pts.length<2){fallbackRouteWall(s);return}if(!HAS_AMAP_KEY||!HAS_AMAP_SECURITY||!window.AMapLoader){fallbackRouteWall(s);return}try{const AMap=await AMapLoader.load({key:AMAP_KEY,version:'2.1Beta',plugins:['AMap.ToolBar','AMap.ControlBar']});const path=streamPath(pts);const center=path[Math.floor(path.length/2)];const longRoute=(Number(s.distance_km)||0)>40;const amap=new AMap.Map('map',{viewMode:longRoute?'2D':'3D',terrain:!longRoute,pitch:longRoute?0:48,rotation:longRoute?0:-18,zoom:13,center,mapStyle:'amap://styles/normal',features:['bg','road','building','point'],resizeEnable:true,showLabel:true,rotateEnable:true,pitchEnable:true});if(AMap.ToolBar)amap.addControl(new AMap.ToolBar({position:{right:'14px',top:'14px'}}));if(AMap.ControlBar&&!longRoute)amap.addControl(new AMap.ControlBar({position:{right:'14px',top:'72px'}}));const context=contextRoutes(data,s).map(r=>new AMap.Polyline({path:lngLatPath(samplePoints(r.points,900)),strokeColor:'#0f766e',strokeOpacity:.26,strokeWeight:longRoute?2.4:3.2,lineJoin:'round',lineCap:'round',zIndex:18}));const shadow=new AMap.Polyline({path,strokeColor:'#111827',strokeOpacity:.64,strokeWeight:longRoute?8:10,lineJoin:'round',lineCap:'round',zIndex:28});const lines=gradeGroups(pts).map(g=>new AMap.Polyline({path:g.path,strokeColor:g.color,strokeOpacity:.98,strokeWeight:longRoute?4.2:5.2,lineJoin:'round',lineCap:'round',zIndex:31}));const start=new AMap.Marker({position:path[0],content:startMarker(),offset:new AMap.Pixel(-9,-9),zIndex:40});const end=new AMap.Marker({position:path[path.length-1],content:finishMarker(),offset:new AMap.Pixel(-8,-8),zIndex:40});amap.add([...context,shadow,...lines,start,end]);const fit=()=>{const lngs=path.map(p=>p[0]),lats=path.map(p=>p[1]);amap.setBounds(new AMap.Bounds([Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]),false,longRoute?[60,82,150,82]:[58,68,62,68])};fit();setTimeout(()=>{fit();if(longRoute)amap.setZoom(Math.max(3,amap.getZoom()-2))},650);if(!longRoute)drawScreenRoute(amap,path);const legend=document.createElement('div');legend.className='amap-grade-legend';legend.innerHTML='<span class="amap-grade-ramp"></span><span>淡线=骑过路线 · 亮线=赛段坡度</span>';document.getElementById('map').appendChild(legend)}catch(err){console.warn('AMap segment fallback',err);fallbackRouteWall(s)}}
async function boot(){const id=new URLSearchParams(location.search).get('id');const data=await fetch('heatmap_data.json?ts=1779317207').then(r=>r.json());const s=data.segments.find(x=>String(x.id)===String(id))||data.segments[0];if(!s){title.textContent='找不到赛段';return}const profile=streamProfile(s);title.textContent=`“${s.name}” Route Details`;lede.textContent=`${s.distance_km} km · Gain ${s.elev_gain_m} m · ${s.avg_grade}% avg · 我的 PR ${s.my_pr||s.pr_time||'-'} · ${s.profile_source==='strava_stream'?'Strava streams':'detail fallback'}`;profileTitle.textContent=s.name;heroProfile.innerHTML=profileSvg(profile,'mini');bigProfile.innerHTML=profileSvg(profile,'big');side.innerHTML=sideHtml(s);renderHighlights(s);describe(s);await drawAmapSegment(s,data);window.__SEGMENT_READY=true}
boot().catch(err=>{title.textContent='页面初始化失败';lede.textContent=err.message});
