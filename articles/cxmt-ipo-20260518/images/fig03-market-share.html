<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wechat chart capture</title>
</head>
<body style="margin:0;background:#FAF8F5;color:#1a1a1a;font-family:Georgia,'Songti SC','Noto Serif SC',serif;">
  <section id="shot" style="width:760px;margin:0 auto;padding:28px 30px;background:#FAF8F5;box-sizing:border-box;">


  <figure style="margin:32px 0;background:#fff;border:1px solid #ECE8E0;padding:20px;">
    <div style="font-size:13px;color:#1a1a1a;font-weight:600;margin-bottom:4px;">图 · DRAM 全球市场份额</div>
    <div style="font-size:12px;color:#6b6b6b;margin-bottom:14px;font-style:italic;">前 4 家 + 其他 · 数据：Counterpoint / TrendForce</div>
    <div style="padding:8px 0 2px;">
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 16px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;">三星</div>
        <div style="flex:1;height:24px;background:#F3EFE6;"><div style="width:100%;height:24px;background:#8A7D6A;"></div></div>
        <div style="width:48px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#1a1a1a;">36%</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 16px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;">SK 海力士</div>
        <div style="flex:1;height:24px;background:#F3EFE6;"><div style="width:97.2%;height:24px;background:#8A7D6A;"></div></div>
        <div style="width:48px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#1a1a1a;">35%</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 16px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;">美光</div>
        <div style="flex:1;height:24px;background:#F3EFE6;"><div style="width:61.1%;height:24px;background:#8A7D6A;"></div></div>
        <div style="width:48px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#1a1a1a;">22%</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 16px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;">长鑫</div>
        <div style="flex:1;height:24px;background:#F3EFE6;"><div style="width:13.9%;min-width:20px;height:24px;background:#E30613;"></div></div>
        <div style="width:48px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#E30613;">5%</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 8px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;">其他</div>
        <div style="flex:1;height:24px;background:#F3EFE6;"><div style="width:5.6%;min-width:14px;height:24px;background:#D8D4CC;"></div></div>
        <div style="width:48px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#8A7D6A;">2%</div>
      </div>
    </div>
  </figure>
  </section>
</body>
</html>
