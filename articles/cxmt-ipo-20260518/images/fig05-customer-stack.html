<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wechat chart capture</title>
</head>
<body style="margin:0;background:#FAF8F5;color:#1a1a1a;font-family:Georgia,'Songti SC','Noto Serif SC',serif;">
  <section id="shot" style="width:760px;margin:0 auto;padding:28px 30px;background:#FAF8F5;box-sizing:border-box;">


  <figure style="margin:32px 0;background:#fff;border:1px solid #ECE8E0;padding:20px;">
    <div style="font-size:13px;color:#1a1a1a;font-weight:600;margin-bottom:4px;">图 · 各家 DRAM 收入按客户层堆叠</div>
    <div style="font-size:12px;color:#6b6b6b;margin-bottom:14px;font-style:italic;">L1 HBM / AI · L3 云服务器 · 消费 · 工业利基</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px 16px;margin:4px 0 18px;font-size:11px;color:#444;">
      <span><i style="display:inline-block;width:10px;height:10px;background:#E30613;margin-right:5px;"></i>L1 HBM/AI</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:#5A5A5A;margin-right:5px;"></i>L3 云服务器</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:#8A7D6A;margin-right:5px;"></i>消费</span>
      <span><i style="display:inline-block;width:10px;height:10px;background:#C5BFB0;margin-right:5px;"></i>工业/利基</span>
    </div>
    <div style="padding:4px 0 2px;">
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 18px;">
        <div style="width:72px;font-size:13px;color:#1a1a1a;">三星</div>
        <div style="flex:1;height:30px;display:flex;background:#F3EFE6;">
          <div style="width:25%;height:30px;background:#E30613;"></div><div style="width:35%;height:30px;background:#5A5A5A;"></div><div style="width:30%;height:30px;background:#8A7D6A;"></div><div style="width:10%;height:30px;background:#C5BFB0;"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 18px;">
        <div style="width:72px;font-size:13px;color:#1a1a1a;">SK 海力士</div>
        <div style="flex:1;height:30px;display:flex;background:#F3EFE6;">
          <div style="width:45%;height:30px;background:#E30613;"></div><div style="width:25%;height:30px;background:#5A5A5A;"></div><div style="width:25%;height:30px;background:#8A7D6A;"></div><div style="width:5%;height:30px;background:#C5BFB0;"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 18px;">
        <div style="width:72px;font-size:13px;color:#1a1a1a;">美光</div>
        <div style="flex:1;height:30px;display:flex;background:#F3EFE6;">
          <div style="width:15%;height:30px;background:#E30613;"></div><div style="width:50%;height:30px;background:#5A5A5A;"></div><div style="width:15%;height:30px;background:#8A7D6A;"></div><div style="width:20%;height:30px;background:#C5BFB0;"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 8px;">
        <div style="width:72px;font-size:13px;color:#1a1a1a;">长鑫</div>
        <div style="flex:1;height:30px;display:flex;background:#F3EFE6;">
          <div style="width:0;height:30px;background:#E30613;"></div><div style="width:25%;height:30px;background:#5A5A5A;"></div><div style="width:55%;height:30px;background:#8A7D6A;"></div><div style="width:20%;height:30px;background:#C5BFB0;"></div>
        </div>
      </div>
    </div>
    <div style="font-size:11px;color:#8A7D6A;text-align:right;margin-top:12px;">横轴上限 = 100%</div>
  </figure>
  </section>
</body>
</html>
