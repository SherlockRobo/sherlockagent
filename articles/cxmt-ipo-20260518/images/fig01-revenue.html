<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wechat chart capture</title>
</head>
<body style="margin:0;background:#FAF8F5;color:#1a1a1a;font-family:Georgia,'Songti SC','Noto Serif SC',serif;">
  <section id="shot" style="width:760px;margin:0 auto;padding:28px 30px;background:#FAF8F5;box-sizing:border-box;">


  <figure style="margin:32px 0;background:#fff;border:1px solid #ECE8E0;padding:20px;">
    <div style="font-size:13px;color:#1a1a1a;font-weight:600;margin-bottom:4px;">图 · 2026Q1 营收对比（亿 RMB）</div>
    <div style="font-size:12px;color:#6b6b6b;margin-bottom:14px;font-style:italic;">长鑫 = 美光 31% / SK 海力士 20% / 三星 DS 13%</div>
    <div style="padding:8px 0 2px;">
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 18px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;line-height:1.3;">三星 DS</div>
        <div style="flex:1;height:28px;background:#F3EFE6;"><div style="width:100%;height:28px;background:#8A7D6A;"></div></div>
        <div style="width:72px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#1a1a1a;">3,995</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 18px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;line-height:1.3;">SK 海力士</div>
        <div style="flex:1;height:28px;background:#F3EFE6;"><div style="width:64.4%;height:28px;background:#8A7D6A;"></div></div>
        <div style="width:72px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#1a1a1a;">2,571</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 18px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;line-height:1.3;">美光 FQ2</div>
        <div style="flex:1;height:28px;background:#F3EFE6;"><div style="width:41.4%;height:28px;background:#8A7D6A;"></div></div>
        <div style="width:72px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#1a1a1a;">1,653</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin:0 0 10px;">
        <div style="width:92px;font-size:13px;color:#1a1a1a;line-height:1.3;">长鑫</div>
        <div style="flex:1;height:28px;background:#F3EFE6;"><div style="width:12.7%;min-width:24px;height:28px;background:#E30613;"></div></div>
        <div style="width:72px;text-align:right;font:600 12px Georgia,'Songti SC',serif;color:#E30613;">508</div>
      </div>
      <div style="font-size:11px;color:#8A7D6A;text-align:right;margin-top:12px;">单位：亿 RMB</div>
    </div>
  </figure>
  </section>
</body>
</html>
