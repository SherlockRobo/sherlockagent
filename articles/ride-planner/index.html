<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RidePlan · 城市骑行路线策略器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#eef2f6}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:64px 1fr}.appbar{height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 22px;background:#0f172a;color:white;border-bottom:1px solid rgba(255,255,255,.08)}.brand{display:flex;align-items:center;gap:12px;min-width:260px}.logo{width:34px;height:34px;border-radius:8px;background:#2563eb;display:grid;place-items:center;font-weight:1000}.brand h1{font-size:18px;margin:0;letter-spacing:.02em}.brand span{display:block;font-size:11px;color:#94a3b8;margin-top:2px}.top-metrics{display:flex;align-items:center;gap:10px}.top-metrics .metric{height:38px;min-width:92px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:8px;padding:5px 9px}.metric b{display:block;font-size:14px}.metric span{font-size:10px;color:#94a3b8}.inputs{display:flex;gap:8px}.field{width:82px;height:38px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);border-radius:8px;padding:4px 8px}.field label{display:block;font-size:9px;color:#94a3b8;font-weight:800}.field input{width:100%;border:0;outline:0;background:transparent;color:white;font-size:16px;font-weight:900}.workspace{min-height:0;display:grid;grid-template-columns:356px minmax(460px,1fr) 374px;gap:12px;padding:12px}.panel{background:rgba(255,255,255,.94);border:1px solid #d9e1ea;border-radius:8px;box-shadow:0 12px 28px rgba(15,23,42,.08)}.left,.right{min-height:0;display:flex;flex-direction:column;overflow:hidden}.panel-head{padding:14px 14px 10px;border-bottom:1px solid #e5e7eb}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#2563eb;font-weight:1000}.panel-head h2{font-size:24px;line-height:1.05;margin:6px 0 8px}.muted{color:#64748b;line-height:1.5;font-size:13px;margin:0}.route-list{padding:10px;display:flex;flex-direction:column;gap:9px;overflow:auto}.route-card{border:1px solid #e2e8f0;background:#fff;border-radius:7px;padding:12px;cursor:pointer}.route-card.active{border-color:#2563eb;background:#eff6ff;box-shadow:inset 3px 0 0 #2563eb}.route-card h2{font-size:16px;line-height:1.2;margin:0}.route-card .meta{font-size:12px;color:#64748b;margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{font-size:10px;font-weight:900;color:#166534;background:#dcfce7;border-radius:999px;padding:3px 7px}.chip.blue{color:#1d4ed8;background:#dbeafe}.map-panel{position:relative;overflow:hidden}.map{position:absolute;inset:0}.map-card{position:absolute;z-index:500;left:14px;top:14px;width:min(640px,calc(100% - 28px));padding:14px}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.title-row h2{font-size:25px;margin:0 0 5px}.pill{display:inline-flex;align-items:center;height:28px;border-radius:999px;background:#0f172a;color:white;padding:0 10px;font-size:11px;font-weight:1000;white-space:nowrap}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{border:1px solid #e2e8f0;background:#f8fafc;border-radius:7px;padding:9px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#64748b}.legend{position:absolute;left:14px;bottom:14px;z-index:500;background:rgba(255,255,255,.92);border:1px solid #dbe3ec;border-radius:999px;padding:8px 11px;font-size:12px;color:#475569}.sw{display:inline-block;width:58px;height:8px;border-radius:999px;background:linear-gradient(90deg,#2563eb,#22c55e,#f59e0b);margin-right:8px}.right{gap:12px}.decision{padding:14px;overflow:auto}.block{border-bottom:1px solid #e5e7eb;padding:0 0 14px;margin-bottom:14px}.block:last-child{border-bottom:0;margin-bottom:0}.block-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.block-title h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:#2563eb}.weather{display:grid;grid-template-columns:1fr;gap:8px}.weather-card{border:1px solid #e2e8f0;background:#f8fafc;border-radius:7px;padding:10px}.weather-card.best{border-color:#16a34a;background:#f0fdf4}.weather-card b{display:block;font-size:15px}.weather-card span{display:block;color:#64748b;font-size:11px;margin-top:3px}.segment-list,.plan-list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;border:1px solid #e5e7eb;background:#fff;border-radius:7px;padding:9px}.row strong{font-size:13px}.row small{color:#64748b;font-size:12px}.row b{font-size:14px;white-space:nowrap}.route-line{filter:drop-shadow(0 6px 9px rgba(37,99,235,.25))}@media(max-width:1100px){html,body{height:auto}body{overflow:auto}.app{display:block;height:auto;min-height:100vh}.appbar{position:sticky;top:0;z-index:900;height:auto;min-height:64px;flex-wrap:wrap;padding:10px 14px}.top-metrics{order:3;width:100%;overflow-x:auto}.workspace{display:block;padding:10px}.left,.right{display:block;overflow:visible;margin-bottom:10px}.route-list{max-height:none}.map-panel{height:54vh;margin-bottom:10px}.map-card{position:relative;left:auto;top:auto;width:auto;margin:10px}.map{position:absolute}.legend{display:none}.detail-grid{grid-template-columns:repeat(2,1fr)}.right{gap:0}.decision{overflow:visible}.weather{grid-template-columns:1fr}}@media(max-width:560px){.appbar{display:grid;grid-template-columns:1fr;align-items:start}.brand{min-width:auto}.brand h1{font-size:16px}.top-metrics{display:none}.inputs{width:100%;display:grid;grid-template-columns:1fr 1fr}.field{width:auto}.workspace{padding:8px}.panel-head h2{font-size:22px}.map-panel{height:auto}.map{position:relative;height:330px}.map-card{margin:0;border-radius:0;border-left:0;border-right:0}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:18px}}
</style>
</head>
<body>
<main class="app">
  <header class="appbar">
    <div class="brand"><div class="logo">R</div><div><h1>RidePlan</h1><span>城市骑行路线策略器</span></div></div>
    <div class="top-metrics">
      <div class="metric"><b id="totalRoutes">-</b><span>路线模板</span></div>
      <div class="metric"><b id="totalKm">-</b><span>路线 km</span></div>
      <div class="metric"><b id="totalClimb">-</b><span>总爬升 m</span></div>
    </div>
    <div class="inputs">
      <div class="field"><label>FTP</label><input id="ftpInput" type="number" value="220" min="80" max="500"></div>
      <div class="field"><label>KG</label><input id="weightInput" type="number" value="70" min="35" max="130"></div>
    </div>
  </header>
  <section class="workspace">
    <aside class="panel left">
      <div class="panel-head">
        <div class="eyebrow">Beijing MVP Routes</div>
        <h2>选择一条路线</h2>
        <p class="muted">Demo 使用样例路线，不依赖个人 Strava 数据。后续可接 GPX、路线库或 Strava 授权。</p>
      </div>
      <div class="route-list" id="routeList"></div>
    </aside>
    <section class="panel map-panel">
      <div id="map" class="map"></div>
      <section class="panel map-card">
        <div class="title-row"><div><h2 id="routeTitle">-</h2><p class="muted" id="routeDesc"></p></div><span class="pill" id="routeType">-</span></div>
        <div class="detail-grid">
          <div class="stat"><b id="routeKm">-</b><span>km</span></div>
          <div class="stat"><b id="routeGain">-</b><span>爬升 m</span></div>
          <div class="stat"><b id="routeWkg">-</b><span>目标 W/kg</span></div>
          <div class="stat"><b id="routeTime">-</b><span>预计用时</span></div>
        </div>
      </section>
      <div class="legend"><span class="sw"></span>蓝色路线 · 绿色关键路段 · 橙色天气采样点</div>
    </section>
    <aside class="panel right">
      <div class="decision">
        <section class="block">
          <div class="block-title"><h3>Weather Window</h3><span class="muted">Open-Meteo</span></div>
          <div class="weather" id="weatherBox"><p class="muted">选择路线后加载天气。</p></div>
        </section>
        <section class="block">
          <div class="block-title"><h3>Pacing Plan</h3><span class="muted">按 FTP 重算</span></div>
          <div class="plan-list" id="plan"></div>
        </section>
        <section class="block">
          <div class="block-title"><h3>Key Segments</h3><span class="muted">路线结构</span></div>
          <div class="segment-list" id="segments"></div>
        </section>
      </div>
    </aside>
  </section>
</main>
<script>
const map=L.map('map',{zoomControl:false,preferCanvas:true});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:['1','2','3','4'],maxZoom:18,attribution:'&copy; AutoNavi'}).addTo(map);
const routeLayer=L.layerGroup().addTo(map);
const pointLayer=L.layerGroup().addTo(map);
let DATA,ACTIVE;
const $=(id)=>document.getElementById(id);
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function dirText(deg){const names=['北','东北','东','东南','南','西南','西','西北'];return names[Math.round(deg/45)%8]}
function cardHtml(r){return '<article class="route-card" data-id="'+r.id+'"><h2>'+r.name+'</h2><div class="meta">'+r.area+' · '+r.km+' km · Gain '+fmt(r.gain_m)+' m</div><div class="chips"><span class="chip blue">'+r.type+'</span><span class="chip">'+r.key_segments.length+' key segments</span><span class="chip">sample route</span></div></article>'}
function row(title,value,note){return '<div class="row"><div><strong>'+title+'</strong><br><small>'+note+'</small></div><b>'+value+'</b></div>'}
function fitBounds(bounds){map.fitBounds([[bounds[0][0],bounds[0][1]],[bounds[1][0],bounds[1][1]]],{padding:[80,80]})}
function planFor(route){const ftp=Number($('ftpInput').value)||220;const endurance=Math.round(ftp*(route.km>100?.68:.72));const climb=Math.round(ftp*(route.gain_m>1200?.86:.82));const punch=Math.round(ftp*1.03);const hours=Math.max(.8,route.km/(route.gain_m>1200?22:route.gain_m>500?25:28));return{estimated_time:Math.floor(hours)+'h '+Math.round((hours%1)*60)+'m',sections:[{name:'Start / Warm-up',target:(endurance-10)+'-'+(endurance+5)+'W',note:'Keep it controlled for the first 20 minutes.'},{name:'Main tempo',target:endurance+'-'+climb+'W',note:'Stay aerobic unless the route demands a short push.'},{name:'Key climbs',target:climb+'-'+punch+'W',note:'Allow short efforts above threshold on steep ramps.'},{name:'Return leg',target:Math.round(ftp*.65)+'-'+endurance+'W',note:'Use wind direction to decide whether to conserve or press.'}]}}
function renderRoute(id){const r=DATA.routes.find(x=>x.id===id)||DATA.routes[0];ACTIVE=r;const p=planFor(r);document.querySelectorAll('.route-card').forEach(el=>el.classList.toggle('active',el.dataset.id===r.id));$('routeTitle').textContent=r.name;$('routeDesc').textContent=r.area+' · standalone route template · main direction '+dirText(r.direction_deg);$('routeType').textContent=r.type;$('routeKm').textContent=r.km;$('routeGain').textContent=fmt(r.gain_m);$('routeWkg').textContent=(Number($('ftpInput').value||220)/Number($('weightInput').value||70)).toFixed(1);$('routeTime').textContent=p.estimated_time;
routeLayer.clearLayers();pointLayer.clearLayers();L.polyline(r.points,{color:'#0f172a',weight:8,opacity:.45,className:'route-line'}).addTo(routeLayer);L.polyline(r.points,{color:'#2563eb',weight:4,opacity:.96}).addTo(routeLayer);for(const s of r.key_segments){if(s.center)L.circleMarker(s.center,{radius:6,color:'#166534',fillColor:'#22c55e',fillOpacity:.9,weight:2}).bindTooltip(s.name).addTo(pointLayer)}for(const pt of r.sample_points){L.circleMarker(pt,{radius:4,color:'#ea580c',fillColor:'#fb923c',fillOpacity:.9,weight:1}).addTo(pointLayer)}fitBounds(r.bounds);
$('segments').innerHTML=r.key_segments.map((s,i)=>row('#'+(i+1)+' '+s.name,s.avg_grade,s.distance_km+' km · Gain '+s.gain_m+'m')).join('');
$('plan').innerHTML=p.sections.map(s=>row(s.name,s.target,s.note)).join('');
loadWeather(r);
}
function nextSlots(){const now=new Date();const hours=[7,9,15];const out=[];for(let d=0;d<3;d++){for(const h of hours){const t=new Date(now);t.setDate(now.getDate()+d);t.setHours(h,0,0,0);if(t>now)out.push(t)}}return out.slice(0,3)}
function hourKey(d){return d.toISOString().slice(0,13)+':00'}
function windLabel(head){if(head>3)return '逆风';if(head<-3)return '顺风';return '侧风'}
async function loadWeather(route){$('weatherBox').innerHTML='<p class="muted">加载 Open-Meteo 路线天气...</p>';try{const pts=route.sample_points.slice(0,8);const lat=pts.map(p=>p[0].toFixed(4)).join(',');const lng=pts.map(p=>p[1].toFixed(4)).join(',');const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_direction_10m&forecast_days=3&timezone=Asia%2FShanghai';const res=await fetch(url);if(!res.ok)throw new Error('weather '+res.status);const raw=await res.json();const arr=Array.isArray(raw)?raw:[raw];const cards=nextSlots().map(slot=>scoreSlot(slot,arr,route)).sort((a,b)=>b.score-a.score);$('weatherBox').innerHTML=cards.map((c,i)=>'<div class="weather-card '+(i===0?'best':'')+'"><b>'+c.label+'</b><span>'+c.temp+'°C · '+c.rain+'% 雨</span><span>'+c.wind+' km/h · '+c.windType+'</span><span>评分 '+c.score+'/100</span></div>').join('')}catch(e){$('weatherBox').innerHTML='<div class="weather-card best"><b>天气暂不可用</b><span>保留路线计划</span><span>后续可接后端缓存</span></div>'}}
function scoreSlot(slot,arr,route){let temps=[],rains=[],winds=[],heads=[];const key=hourKey(slot);for(const p of arr){const times=p.hourly.time.map(t=>t.replace('T',' '));const target=key.replace('T',' ');let idx=times.findIndex(t=>t.startsWith(target.slice(0,13)));if(idx<0)idx=0;const temp=p.hourly.temperature_2m[idx]||0;const rain=p.hourly.precipitation_probability[idx]||0;const ws=p.hourly.wind_speed_10m[idx]||0;const wd=p.hourly.wind_direction_10m[idx]||0;const head=ws*Math.cos((wd-route.direction_deg)*Math.PI/180);temps.push(temp);rains.push(rain);winds.push(ws);heads.push(head)}const avg=a=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length);const max=a=>Math.max(...a,0);const temp=Math.round(avg(temps));const rain=Math.round(max(rains));const wind=Math.round(avg(winds));const head=Math.round(avg(heads));const score=Math.max(20,Math.round(100-rain*.45-Math.max(0,wind-18)*1.2-Math.max(0,head)*1.5-Math.max(0,temp-30)*2));return{label:slot.toLocaleString('zh-CN',{weekday:'short',hour:'2-digit',minute:'2-digit'}),temp,rain,wind,windType:windLabel(head),score}}
function recalc(){if(ACTIVE)renderRoute(ACTIVE.id)}
$('ftpInput').addEventListener('change',recalc);$('weightInput').addEventListener('change',recalc);
fetch('sample_routes.json?ts='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;$('totalRoutes').textContent=d.routes.length;$('totalKm').textContent=fmt(d.city.summary.route_km);$('totalClimb').textContent=fmt(d.city.summary.climb_m);$('routeList').innerHTML=d.routes.map(cardHtml).join('');document.querySelectorAll('.route-card').forEach(el=>el.onclick=()=>renderRoute(el.dataset.id));renderRoute(d.routes[0].id)});
</script>
</body>
</html>
